[package]
name = "capture-workbench-desktop"
version = "0.1.0"
description = "Tauri verification harness for Capture Workbench"
authors = ["Capture Workbench contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "capture_workbench_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "capture-workbench-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
