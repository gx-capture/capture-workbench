[package]
name = "capture-workbench-desktop"
version = "0.3.10"
description = "Tauri verification harness for Capture Workbench"
authors = ["Capture Workbench contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "capture_workbench_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
model-smoke-app-data = []

[[bin]]
name = "capture-workbench-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
capture-sidecar-launcher = { path = "../../../packages/capture-sidecar-launcher" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
tempfile = "3"
