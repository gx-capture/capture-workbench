[package]
name = "capture-workbench-desktop"
version = "0.3.7"
description = "Tauri verification harness for Capture Workbench"
authors = ["Capture Workbench contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "capture_workbench_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "capture-workbench-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
