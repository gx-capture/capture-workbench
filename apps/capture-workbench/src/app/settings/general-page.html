<section
  class="flex flex-col gap-6"
  data-testid="page-settings-general"
>
  <h2 class="break-words text-lg font-semibold">{{ m().settingsGeneralTitle }}</h2>

  <div hlmCard class="p-6">
    <fieldset class="flex flex-col gap-3" data-testid="general-language">
      <legend class="text-sm font-medium text-foreground">
        {{ m().language }}
      </legend>
      <div class="flex flex-col gap-2">
        @for (option of locales; track option) {
          <label
            class="flex cursor-pointer items-center gap-2.5 text-sm text-foreground"
          >
            <input
              type="radio"
              name="general-language"
              class="size-4 accent-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
              data-testid="general-language-option"
              [attr.data-locale]="option"
              [value]="option"
              [checked]="locale() === option"
              (change)="setLocale(option)"
            />
            <span>{{ languageName(option) }}</span>
          </label>
        }
      </div>
    </fieldset>
  </div>
</section>
