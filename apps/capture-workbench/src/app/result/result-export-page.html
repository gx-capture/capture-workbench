<section class="flex flex-col gap-5">
  <h2 class="break-words text-lg font-semibold text-foreground">{{ m().resultTabExport }}</h2>

  <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-border bg-card px-5 py-4">
    <p class="text-sm text-muted-foreground">{{ m().exportCopyNote }}</p>
    <button
      hlmBtn
      variant="outline"
      size="sm"
      type="button"
      data-testid="result-export-copy"
      [disabled]="store.disabled()"
      [attr.aria-busy]="store.busy()"
      (click)="store.copy()"
    >
      {{ m().exportCopy }}
    </button>
  </div>

  <ul
    class="divide-y divide-border rounded-xl border border-border bg-card"
    data-testid="result-export-list"
  >
    @for (item of store.formats(); track item.format) {
      <li
        class="flex items-center justify-between gap-4 px-5 py-4"
        data-testid="result-export-row"
      >
        <div class="flex min-w-0 flex-col gap-0.5">
          <span class="text-sm font-medium text-foreground">{{ item.label }}</span>
          <span class="text-xs text-muted-foreground">{{ item.description }}</span>
        </div>
        <button
          hlmBtn
          variant="outline"
          size="sm"
          type="button"
          [attr.data-testid]="'result-export-' + item.format"
          [disabled]="store.disabled()"
          [attr.aria-busy]="store.busy()"
          (click)="store.download(item.format)"
        >
          {{ m().exportDownload }}
        </button>
      </li>
    }
  </ul>

  <p
    role="status"
    aria-live="polite"
    class="text-xs text-muted-foreground"
    data-testid="result-export-status"
  >
    {{ store.status() }}
  </p>
</section>
