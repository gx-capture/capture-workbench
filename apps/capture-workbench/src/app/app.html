<div
  class="flex h-screen bg-background text-foreground"
  data-testid="app-shell"
>
  <nav
    class="flex w-52 shrink-0 flex-col gap-6 border-r border-sidebar-border bg-sidebar px-3 py-5 text-sidebar-foreground"
    data-testid="shell-nav"
    [attr.aria-label]="m().mainNavigation"
  >
    <div class="px-2.5">
      <strong class="block text-lg font-semibold">Capture</strong>
      <small class="text-xs font-semibold tracking-widest text-muted-foreground"
        >WORKBENCH</small
      >
    </div>

    <ul class="flex flex-col gap-1">
      @for (item of navItems(); track item.route) {
      <li>
        <a
          hlmBtn
          variant="ghost"
          class="w-full justify-start"
          routerLinkActive="bg-sidebar-accent font-semibold text-sidebar-accent-foreground"
          ariaCurrentWhenActive="page"
          [routerLink]="['/', item.route]"
          [attr.data-testid]="'nav-' + item.route"
        >
          {{ item.label }}
        </a>
      </li>
      }
    </ul>

    <p
      class="mt-auto flex items-center gap-2 px-2.5 text-sm text-muted-foreground"
      data-testid="runtime-status"
      [attr.data-state]="store.state()"
      aria-live="polite"
    >
      <span
        class="size-2 rounded-full"
        aria-hidden="true"
        [class.bg-primary]="store.state() === 'ready'"
        [class.bg-destructive]="store.state() === 'error'"
        [class.bg-muted-foreground]="store.state() === 'starting'"
      ></span>
      {{ store.state() === 'ready' ? m().ready : m().notReady }}
    </p>
  </nav>

  <main class="min-w-0 flex-1 overflow-auto">
    <router-outlet />
  </main>
</div>
