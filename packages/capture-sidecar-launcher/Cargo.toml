[package]
name = "capture-sidecar-launcher"
version = "0.3.9"
description = "Shared authenticated Capture Runtime sidecar launcher for Windows desktop hosts."
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/gx-capture/capture-workbench"
homepage = "https://github.com/gx-capture/capture-workbench"
readme = "README.md"
keywords = ["capture", "sidecar", "launcher", "windows"]
categories = ["os", "process-management"]

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
