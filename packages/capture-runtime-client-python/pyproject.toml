[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "capture-runtime-client"
version = "0.5.0"
description = "Capture Runtime HTTP, in-memory, discovery, and protocol client SDK."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.13.4,<3.0.0",
]

[tool.capture_runtime_client]
contract_set_sha256 = "4c63044191551bf3f7c36d24d08cc6ced25fcc701bf1e06a0fa69626b1e18f1b"

[tool.hatch.build.targets.wheel]
packages = ["src/capture_runtime_client"]

[tool.hatch.build.targets.wheel.force-include]
"src/capture_runtime_client/py.typed" = "capture_runtime_client/py.typed"
"src/capture_runtime_client/private/assets/contract-set.json" = "capture_runtime_client/private/assets/contract-set.json"
"src/capture_runtime_client/private/assets/contract-set.sha256" = "capture_runtime_client/private/assets/contract-set.sha256"

[dependency-groups]
dev = [
  "mypy>=1.14.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
# Remove tmp_path directories after every session; tests must not leave temp files.
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
