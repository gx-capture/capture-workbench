[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "capture-runtime-client"
version = "0.4.1"
description = "Capture Runtime HTTP, in-memory, discovery, and protocol client SDK."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.13.4,<3.0.0",
]

[tool.capture_runtime_client]
contract_set_sha256 = "b28366f022533192c063056bbf64cacfd09390815c65408066369dd61094e278"

[tool.hatch.build.targets.wheel]
packages = ["src/capture_runtime_client"]

[tool.hatch.build.targets.wheel.force-include]
"src/capture_runtime_client/py.typed" = "capture_runtime_client/py.typed"
"src/capture_runtime_client/private/assets/contract-set.json" = "capture_runtime_client/private/assets/contract-set.json"
"src/capture_runtime_client/private/assets/contract-set.sha256" = "capture_runtime_client/private/assets/contract-set.sha256"

[dependency-groups]
dev = [
  "mypy>=1.14.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
