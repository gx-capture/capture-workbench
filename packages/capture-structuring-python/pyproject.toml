[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "capture-structuring"
version = "0.3.9"
description = "Brain-agnostic, provenance-safe Capture Workbench host structuring SDK."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "capture-contracts>=0.3.9,<0.4.0",
  "jsonschema>=4.25.0,<5.0.0",
  "pydantic>=2.12.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capture_structuring"]

[tool.hatch.build.targets.wheel.force-include]
"src/capture_structuring/py.typed" = "capture_structuring/py.typed"

[dependency-groups]
dev = [
  "mypy>=1.14.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
  "types-jsonschema>=4.25.0,<5.0.0",
]

[tool.uv.sources]
capture-contracts = { path = "../capture-contracts/python" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
