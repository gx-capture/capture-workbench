<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture Workbench custom element fixture</title>
  </head>
  <body>
    <capture-workbench></capture-workbench>

    <!-- Run this fixture through a bundler that resolves the NPM package. -->
    <script type="module">
      import {
        CAPTURE_WORKBENCH_CUSTOM_EVENTS,
        defineCaptureWorkbenchElement,
      } from '@gx-capture/capture-workbench';

      defineCaptureWorkbenchElement().subscribe({
        next: () => {
          const capture = document.querySelector('capture-workbench');
          capture.config = {
            hostManagedHandshake: true,
            showRuntimeSetup: false,
            outputMode: 'text',
          };
          capture.addEventListener(CAPTURE_WORKBENCH_CUSTOM_EVENTS.completed, ({ detail }) => {
            console.log('Runtime-validated CaptureDocumentV1:', detail.document);
          });
          capture.addEventListener(CAPTURE_WORKBENCH_CUSTOM_EVENTS.failed, ({ detail }) => {
            console.error('Capture failed:', detail.error);
          });
        },
        error: (error) => console.error('Element registration failed:', error),
      });
    </script>
  </body>
</html>
