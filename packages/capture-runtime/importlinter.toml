# Architecture rules (DDD refactor step W1, .agents/PLANS/ddd-refactor/). The clusters are
# today's modules grouped by bounded context. Each may import only the contexts upstream of it
# (platform, contracts, worker kernel, provisioning, the three engines, capture, structuring),
# and the engines not each other. Run by `capture-runtime:lint-architecture` as a pinned uv tool,
# so the runtime lock does not change.
[tool.importlinter]
root_package = "capture_runtime"
include_external_packages = true

