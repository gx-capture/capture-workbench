[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "capture-runtime"
version = "0.7.0"
description = "Independent local capture sidecar for Capture Workbench."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
  "av>=18.0.0,<19.0.0",
  "fastapi>=0.128.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "jsonschema>=4.25.0,<5.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "python-multipart>=0.0.22,<1.0.0",
  "uvicorn>=0.40.0,<1.0.0",
]

[project.optional-dependencies]
windowsml = [
  "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
  "paddleocr==3.7.0",
  "paddlex[ocr-core]==3.7.1",
  "pillow>=11.0.0,<13.0.0",
  "pypdfium2>=5.0.0,<6.0.0",
  "pyyaml>=6.0.0,<7.0.0",
]
speech-recognition = [
  "transformers==5.20.2",
  "librosa==1.0.0",
  "torch==2.11.0",
  "numpy>=2.0.0,<3.0.0",
]
diarization = [
  "transformers==5.20.2",
  "librosa==1.0.0",
  "torch==2.11.0",
  "numpy>=2.0.0,<3.0.0",
]

[project.scripts]
capture-runtime = "capture_runtime.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.14.0,<2.0.0",
  "pillow>=11.0.0,<13.0.0",
  "pyinstaller>=6.19.0,<7.0.0",
  "pypdfium2>=5.0.0,<6.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.15.0,<0.16.0",
  "types-jsonschema>=4.25.0,<5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capture_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"src/capture_runtime/assets/engine-catalog.json" = "capture_runtime/assets/engine-catalog.json"
"src/capture_runtime/assets/contract-set.json" = "capture_runtime/assets/contract-set.json"
"src/capture_runtime/assets/contract-set.sha256" = "capture_runtime/assets/contract-set.sha256"
"src/capture_runtime/assets/ocr-profile.json" = "capture_runtime/assets/ocr-profile.json"

[tool.uv]
# Speech recognition runs CUDA PyTorch; diarization runs CPU PyTorch, which keeps its
# worker archive small. Each worker builds in its own environment.
conflicts = [[{ extra = "speech-recognition" }, { extra = "diarization" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "speech-recognition", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
# Remove tmp_path directories after every session; tests must not leave temp files.
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py313"
# Third-party sources kept as upstream wrote them; see _vendor/ndlocr_lite/README.md.
extend-exclude = [
  "src/capture_runtime/_vendor/ndlocr_lite/ndl_parser.py",
  "src/capture_runtime/_vendor/ndlocr_lite/reading_order",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "capture_runtime._vendor.ndlocr_lite.ndl_parser",
  "capture_runtime._vendor.ndlocr_lite.reading_order.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "PIL.*",
  "huggingface_hub.*",
  "onnxruntime.*",
  "paddleocr.*",
  "paddlex.*",
  "transformers.*",
  "librosa.*",
  "numpy.*",
  "torch.*",
  "uvicorn.*",
  "yaml.*",
]
ignore_missing_imports = true
