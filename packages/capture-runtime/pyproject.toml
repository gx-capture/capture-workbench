[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "capture-runtime"
version = "0.3.0"
description = "Independent local capture sidecar for Capture Workbench."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.128.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pillow>=11.0.0,<13.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "pypdf>=6.0.0,<7.0.0",
  "pypdfium2>=5.0.0,<6.0.0",
  "python-multipart>=0.0.22,<1.0.0",
  "uvicorn[standard]>=0.40.0,<1.0.0",
]

[project.optional-dependencies]
windowsml = [
  "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
  "paddleocr==3.7.0",
  "paddlex[ocr-core]==3.7.1",
]
whisper = [
  "faster-whisper==1.2.1",
  "huggingface-hub>=1.18.0,<2.0.0",
  "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
  "onnxruntime>=1.14,<2.0; sys_platform != 'win32'",
]

[project.scripts]
capture-runtime = "capture_runtime.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.14.0,<2.0.0",
  "pyinstaller>=6.19.0,<7.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capture_runtime"]

[tool.uv]
exclude-dependencies = [
  { package = { name = "faster-whisper", version = "1.2.1" }, dependencies = ["onnxruntime"] },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "ctranslate2.*",
  "faster_whisper.*",
  "huggingface_hub.*",
  "onnxruntime.*",
  "paddleocr.*",
  "uvicorn.*",
]
ignore_missing_imports = true
