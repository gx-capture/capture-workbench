name: Reusable Capture Stable Pointer Publication

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      candidate_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: capture-release-index
    steps:
      - name: Check out the pinned promotion tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download the public immutable release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          directory="$RUNNER_TEMP/release-manifest"
          manifest_name="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            | jq -er '[.assets[].name | select(test("^capture-release-manifest-v[12]\\.json$"))] | select(length == 1) | .[0]')"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$manifest_name" --dir "$directory"
          manifest="$directory/$manifest_name"
          gh attestation verify "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/_publish-github-release.yml"
          node tools/release/full-release-manifest.ts "$manifest" "$tag" '${{ inputs.candidate_id }}'
          test "$(jq -r '.sourceCommit' "$manifest")" = '${{ inputs.source_commit }}'
          echo "MANIFEST_SHA256=$(sha256sum "$manifest" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "MANIFEST_ASSET_NAME=$manifest_name" >> "$GITHUB_ENV"

      - name: Preserve the tested release-index updater
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cp tools/update-release-index.ts "$RUNNER_TEMP/update-release-index.ts"
          cp tools/release/full-release-manifest.ts "$RUNNER_TEMP/release/"

      - name: Check out the protected release-index branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/release-index:refs/remotes/origin/release-index
          git checkout -B release-index refs/remotes/origin/release-index

      - name: Update discovery pointer and release status index
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/update-release-index.ts" \
            --index release-index \
            --operation promote \
            --tag "$RELEASE_TAG" \
            --candidate-id "$CANDIDATE_ID" \
            --manifest-asset-name "$MANIFEST_ASSET_NAME" \
            --manifest-sha256 "$MANIFEST_SHA256"

      - name: Push only the promotion-owned release-index update
        shell: bash
        run: |
          set -euo pipefail
          git add release-index/stable.json release-index/releases.json
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(release-index): point stable at ${{ inputs.tag }}"
          git push origin HEAD:refs/heads/release-index
