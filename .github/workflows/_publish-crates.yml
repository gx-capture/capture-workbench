name: Reusable Capture crates.io Publication

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      candidate_id:
        required: true
        type: string
      source_candidate_id:
        description: 'Underlying runtime candidate ID represented by the crate ledger'
        required: false
        default: ''
        type: string
      source_commit:
        required: true
        type: string
      release_candidate_id:
        description: 'Full release candidate ID bound to this source ledger'
        required: false
        default: ''
        type: string
      contract_set_sha256:
        description: 'Canonical v2 contract-set hash for this release train'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: capture-registry-crates
    steps:
      - name: Check out publication tooling at the candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the prepared immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: promotion-input-${{ inputs.candidate_id }}
          path: promotion-input

      - name: Publish or verify the exact crate archive
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          node tools/publish-crate-candidate.ts \
            --candidate promotion-input/candidate \
            --output registry-ledger-crates.io.json

      - name: Bind crates.io ledger to the full release candidate and contract set
        if: ${{ inputs.release_candidate_id != '' || inputs.contract_set_sha256 != '' }}
        shell: bash
        env:
          RELEASE_CANDIDATE_ID: ${{ inputs.release_candidate_id }}
          SOURCE_CANDIDATE_ID: ${{ inputs.source_candidate_id }}
          CONTRACT_SET_SHA256: ${{ inputs.contract_set_sha256 }}
        run: |
          set -euo pipefail
          node --input-type=module -e "const fs=await import('node:fs/promises'); const crypto=await import('node:crypto'); const path='registry-ledger-crates.io.json'; const ledger=JSON.parse(await fs.readFile(path,'utf8')); if(!/^[0-9a-f]{64}$/.test(process.env.RELEASE_CANDIDATE_ID)||!/^[0-9a-f]{64}$/.test(process.env.CONTRACT_SET_SHA256)) throw new Error('Release candidate ledger binding is incomplete.'); const source=await fs.readFile('promotion-input/candidate/runtime-candidate-manifest.json').catch(()=>fs.readFile('promotion-input/candidate/candidate-manifest.json')); if(process.env.SOURCE_CANDIDATE_ID){ if(!/^[0-9a-f]{64}$/.test(process.env.SOURCE_CANDIDATE_ID)) throw new Error('Source candidate ledger binding is invalid.'); ledger.candidateId=process.env.SOURCE_CANDIDATE_ID; } ledger.releaseCandidateId=process.env.RELEASE_CANDIDATE_ID; ledger.contractSetSha256=process.env.CONTRACT_SET_SHA256; ledger.sourceCandidateManifestSha256=crypto.createHash('sha256').update(source).digest('hex'); await fs.writeFile(path,JSON.stringify(ledger,null,2)+'\\n');"

      - name: Verify clean Cargo installation from crates.io
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile('promotion-input/candidate/candidate-manifest.json','utf8'))); process.stdout.write(m.releaseVersion)")"
          cargo info "capture-sidecar-launcher@$version"

      - name: Upload crates.io publication ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-ledger-crates.io-${{ inputs.release_candidate_id || inputs.candidate_id }}
          path: registry-ledger-crates.io.json
          if-no-files-found: error
          retention-days: 14
