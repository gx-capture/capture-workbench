name: Architecture diff

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Keeps an architecture section in each pull request description
# (tools/architecture-diff.ts): the nodes of every level of
# tools/architecture-graph.ts that the changed files belong to, their direct
# dependencies, and the dependency edges the PR adds and removes. Only the
# text between the section's hidden markers is rewritten; a sticky comment is
# the fallback when the description cannot be updated (a fork's read-only
# token). Only paths that feed the graphs trigger it.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'architecture-graph.config.json'
      - '.github/workflows/architecture-diff.yml'
      - 'nx.json'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'sheriff.config.ts'
      - '!**/*.md'

permissions:
  contents: read
  pull-requests: write

# A newer push to a pull request replaces its older run; only the latest
# head's section matters.
concurrency:
  group: architecture-diff-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  describe:
    runs-on: windows-latest
    timeout-minutes: 30
    # Informational only: a failure here (a base tree that no longer installs,
    # a fork's read-only token) must never block a merge. The blocking rules
    # (Nx tags, import-linter, Sheriff, architecture:check) live in the
    # `checks` job of ci.yml.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # bash keeps redirected output byte-exact (the comment body is zh-TW
      # text); PowerShell re-encodes native output it redirects.
      - name: Head graph
        shell: bash
        run: node tools/architecture-graph.ts > "$RUNNER_TEMP/head.json"

      # The head's copy of the tool reads the base tree through --root, so a
      # base without tools/architecture-graph.ts still works; --config gives it
      # the head's levels, so both graphs have the same levels even when the
      # base has no (or an older) architecture-graph.config.json. `nx graph` needs
      # the workspace's own node_modules (the nx bin refuses a workspace
      # without a local install and resolves nx.json plugins from it), so the
      # base worktree gets its own install. The pnpm store is already warm
      # from the head install, and lifecycle scripts are not needed to read
      # the project graph.
      - name: Base graph
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          pnpm --dir "$RUNNER_TEMP/base" install --frozen-lockfile --prefer-offline --ignore-scripts
          node tools/architecture-graph.ts --root "$RUNNER_TEMP/base" \
            --config architecture-graph.config.json > "$RUNNER_TEMP/base.json"

      # --no-renames lists a moved file's old path too, so the node it left
      # counts as touched; quotePath=false keeps non-ASCII paths unescaped.
      - name: Changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          git -c core.quotePath=false diff --name-only --no-renames
          "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed-files.txt"

      - name: Render section
        shell: bash
        run: >-
          node tools/architecture-diff.ts
          --base "$RUNNER_TEMP/base.json"
          --head "$RUNNER_TEMP/head.json"
          --changed-files "$RUNNER_TEMP/changed-files.txt"
          > "$RUNNER_TEMP/architecture-section.md"

      # Splices the section into the current description (tested in
      # tools/architecture-diff.test.ts) and writes it back only when it
      # changed. --template prints the body byte-exact; --jq would append a
      # newline that every run would add to the description again.
      - name: Update the pull request description
        id: description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/pr-body.md"
          new_body="$RUNNER_TEMP/pr-body-new.md"
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --template '{{if .body}}{{.body}}{{end}}' > "$body" &&
            node tools/architecture-diff.ts --splice-body "$body" \
              --section "$RUNNER_TEMP/architecture-section.md" > "$new_body" &&
            { cmp -s "$body" "$new_body" ||
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
                -F body=@"$new_body" > /dev/null; }; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not update the pull request description; posting the section as a comment instead."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      # Fallback: update the comment that starts with the marker, else add one.
      - name: Create or update the fallback comment
        if: steps.description.outputs.updated != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node tools/architecture-diff.ts --comment \
            --base "$RUNNER_TEMP/base.json" \
            --head "$RUNNER_TEMP/head.json" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            > "$RUNNER_TEMP/architecture-diff.md"
          # Collect every id first: piping into `head` could kill gh with
          # SIGPIPE, which pipefail turns into a failed step.
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- architecture-diff -->"))) | .id')"
          comment_id="${ids%%$'\n'*}"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F body=@"$RUNNER_TEMP/architecture-diff.md" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@"$RUNNER_TEMP/architecture-diff.md" > /dev/null
          fi
