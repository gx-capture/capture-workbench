name: Runtime Promotion

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      runtime_candidate_run_id:
        description: 'Successful Release Runtime Candidate workflow run'
        required: true
        type: string
      runtime_candidate_id:
        description: 'Immutable Runtime Candidate ID'
        required: true
        type: string
      runtime_candidate_manifest_sha256:
        description: 'SHA-256 of the Runtime Candidate candidate-manifest.json'
        required: true
        type: string
      package_candidate_id:
        description: 'Package Candidate ID consumed by the Runtime Candidate'
        required: true
        type: string
      package_promote_run_id:
        description: 'Successful Package Promotion workflow run containing the npm ledger'
        required: true
        type: string
      source_commit:
        description: 'Exact source commit shared by both candidates'
        required: true
        type: string
      release_version:
        description: 'Release SemVer without the v prefix'
        required: true
        type: string
      publication_scope:
        description: 'Publish the runtime GitHub Release only, or also publish Python and crate registries'
        required: true
        default: github-release
        type: choice
        options:
          - github-release
          - registries

permissions:
  actions: read
  contents: read

concurrency:
  group: capture-runtime-promotion-${{ inputs.runtime_candidate_id }}
  cancel-in-progress: false

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    environment: capture-runtime-promotion
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      source_commit: ${{ inputs.source_commit }}
      release_version: ${{ inputs.release_version }}
    steps:
      - name: Check out promotion tooling at the candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact producer workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_run="$(gh run view '${{ inputs.runtime_candidate_run_id }}' --repo '${{ github.repository }}' --json status,conclusion,workflowName,headSha)"
          node --input-type=module -e "const r=JSON.parse(process.argv[1]); if(r.status!=='completed'||r.conclusion!=='success'||r.workflowName!=='Release Runtime Candidate'||r.headSha!=='${{ inputs.source_commit }}') throw new Error('Runtime producer run is not a successful exact-source Runtime Candidate.');" "$runtime_run"
          package_run="$(gh run view '${{ inputs.package_promote_run_id }}' --repo '${{ github.repository }}' --json status,conclusion,workflowName,headSha)"
          node --input-type=module -e "const r=JSON.parse(process.argv[1]); if(r.status!=='completed'||r.conclusion!=='success'||r.workflowName!=='Package Promotion'||r.headSha!=='${{ inputs.source_commit }}') throw new Error('Package promotion run is not a successful exact-source package promotion.');" "$package_run"

      - name: Download and verify the exact Runtime Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-runtime-candidate-${{ inputs.release_version }}-${{ inputs.runtime_candidate_run_id }}
          run-id: ${{ inputs.runtime_candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime-candidate

      - name: Download and verify the published npm ledger
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-ledger-npm-${{ inputs.package_candidate_id }}
          run-id: ${{ inputs.package_promote_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/npm-ledger

      - name: Verify cross-candidate publication identity
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-runtime-candidate.ts \
            --candidate "$RUNNER_TEMP/runtime-candidate" \
            --version '${{ inputs.release_version }}' \
            --source-commit '${{ inputs.source_commit }}' \
            --producer-run-id '${{ inputs.runtime_candidate_run_id }}' \
            --candidate-id '${{ inputs.runtime_candidate_id }}' \
            --candidate-manifest-sha256 '${{ inputs.runtime_candidate_manifest_sha256 }}' \
            --package-candidate-id '${{ inputs.package_candidate_id }}' \
            --require-evidence
          node --input-type=module -e "const l=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); if(l.schemaVersion!=='1'||l.registry!=='npm'||l.candidateId!=='${{ inputs.package_candidate_id }}'||l.releaseVersion!=='${{ inputs.release_version }}'||l.status!=='published') throw new Error('npm ledger is not bound to the published Package Candidate.');" "$RUNNER_TEMP/npm-ledger/registry-ledger-npm.json"

      - name: Upload exact promotion input for registry and release publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promotion-input/candidate"
          cp -a "$RUNNER_TEMP/runtime-candidate/." "$RUNNER_TEMP/promotion-input/candidate/"
      - name: Upload exact promotion input artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-input-${{ inputs.runtime_candidate_id }}
          path: ${{ runner.temp }}/promotion-input
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-pypi:
    if: ${{ inputs.publication_scope == 'registries' }}
    needs: prepare-candidate
    uses: ./.github/workflows/_publish-pypi.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      candidate_id: ${{ inputs.runtime_candidate_id }}
      source_commit: ${{ inputs.source_commit }}
      release_version: ${{ inputs.release_version }}
    secrets: inherit

  publish-crates:
    if: ${{ inputs.publication_scope == 'registries' }}
    needs: prepare-candidate
    uses: ./.github/workflows/_publish-crates.yml
    permissions:
      actions: read
      contents: read
    with:
      candidate_id: ${{ inputs.runtime_candidate_id }}
      source_commit: ${{ inputs.source_commit }}
    secrets: inherit

  tag-runtime-release:
    if: >-
      ${{
        always() &&
        needs.prepare-candidate.result == 'success' &&
        (inputs.publication_scope == 'github-release' ||
         (needs.publish-pypi.result == 'success' && needs.publish-crates.result == 'success'))
      }}
    needs: [prepare-candidate, publish-pypi, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: true
      - name: Create or verify the annotated release tag after selected publication gates pass
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.release_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag^{}")" = '${{ inputs.source_commit }}'
          else
            git tag -a "$tag" '${{ inputs.source_commit }}' -m "Capture Workbench $tag"
          fi
          git push origin "refs/tags/$tag"

  publish-runtime-release:
    if: >-
      ${{
        always() &&
        needs.prepare-candidate.result == 'success' &&
        needs.tag-runtime-release.result == 'success'
      }}
    needs: [prepare-candidate, tag-runtime-release]
    uses: ./.github/workflows/_publish-runtime-github-release.yml
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    with:
      candidate_id: ${{ inputs.runtime_candidate_id }}
      source_commit: ${{ inputs.source_commit }}
      release_version: ${{ inputs.release_version }}
      tag: v${{ inputs.release_version }}
