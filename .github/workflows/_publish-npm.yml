name: Reusable Capture npm Publication

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      candidate_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: capture-registry-npm
    steps:
      - name: Check out publication tooling at the candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Download the prepared immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: promotion-input-${{ inputs.candidate_id }}
          path: promotion-input

      - name: Publish or verify exact npm package bytes
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/publish-npm-candidate.ts \
            --candidate promotion-input/candidate \
            --version '${{ inputs.release_version }}' \
            --output registry-ledger-npm.json

      - name: Verify clean npm installation from GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/capture-npmrc
        run: |
          set -euo pipefail
          printf '@gx-capture:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          probe="$RUNNER_TEMP/capture-npm-probe"
          mkdir -p "$probe"
          cd "$probe"
          npm init --yes >/dev/null
          npm install --ignore-scripts --registry https://npm.pkg.github.com \
            "@gx-capture/capture-workbench@${{ inputs.release_version }}" \
            "@gx-capture/capture-contracts@${{ inputs.release_version }}" \
            "@gx-capture/capture-structuring@${{ inputs.release_version }}"

      - name: Upload npm publication ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-ledger-npm-${{ inputs.candidate_id }}
          path: registry-ledger-npm.json
          if-no-files-found: error
          retention-days: 14
