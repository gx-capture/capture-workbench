name: Reusable Capture npm Publication

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      candidate_kind:
        description: 'desktop for the full release candidate, or package for an npm-only candidate'
        required: false
        default: desktop
        type: string
      candidate_id:
        required: true
        type: string
      candidate_run_id:
        description: 'Producer run ID when candidate_kind is package'
        required: false
        type: string
      candidate_manifest_sha256:
        description: 'Candidate manifest SHA-256 when candidate_kind is package'
        required: false
        type: string
      source_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: capture-registry-npm
    steps:
      - name: Check out publication tooling at the candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Download the prepared immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.candidate_kind != 'package' }}
        with:
          name: promotion-input-${{ inputs.candidate_id }}
          path: promotion-input

      - name: Download the exact immutable Package Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.candidate_kind == 'package' }}
        with:
          name: capture-package-candidate-${{ inputs.release_version }}-${{ inputs.candidate_run_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: promotion-input/candidate

      - name: Verify the package-scoped producer run and evidence
        if: ${{ inputs.candidate_kind == 'package' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test '${{ inputs.candidate_kind }}' = package
          test -n '${{ inputs.candidate_run_id }}'
          test -n '${{ inputs.candidate_manifest_sha256 }}'
          run_json="$(gh run view '${{ inputs.candidate_run_id }}' --repo '${{ github.repository }}' --json status,conclusion,workflowName,headSha)"
          node --input-type=module -e "const r=JSON.parse(process.argv[1]); if(r.status!=='completed'||r.conclusion!=='success'||r.workflowName!=='Release Package Candidate'||r.headSha!=='${{ inputs.source_commit }}') throw new Error('Package producer run is not a successful exact-source package candidate.');" "$run_json"
          node tools/verify-package-candidate.ts \
            --candidate promotion-input/candidate \
            --version '${{ inputs.release_version }}' \
            --source-commit '${{ inputs.source_commit }}' \
            --producer-run-id '${{ inputs.candidate_run_id }}' \
            --candidate-id '${{ inputs.candidate_id }}' \
            --candidate-manifest-sha256 '${{ inputs.candidate_manifest_sha256 }}' \
            --require-evidence

      - name: Publish or verify exact npm package bytes
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/publish-npm-candidate.ts \
            --candidate promotion-input/candidate \
            --version '${{ inputs.release_version }}' \
            --output registry-ledger-npm.json

      - name: Verify clean npm installation from GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/capture-npmrc
        run: |
          set -euo pipefail
          printf 'registry=https://registry.npmjs.org/\n@gx-capture:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          probe="$RUNNER_TEMP/capture-npm-probe"
          mkdir -p "$probe"
          cd "$probe"
          npm init --yes >/dev/null
          npm install --ignore-scripts \
            "@gx-capture/capture-workbench@${{ inputs.release_version }}" \
            "@gx-capture/capture-contracts@${{ inputs.release_version }}" \
            "@gx-capture/capture-structuring@${{ inputs.release_version }}"

      - name: Upload npm publication ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-ledger-npm-${{ inputs.candidate_id }}
          path: registry-ledger-npm.json
          if-no-files-found: error
          retention-days: 14
