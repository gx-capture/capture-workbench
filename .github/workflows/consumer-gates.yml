name: Consumer Candidate Gates

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful release-candidate workflow run containing the immutable candidate'
        required: true
        type: string
      candidate_id:
        description: 'Expected candidate ID'
        required: true
        type: string
      candidate_manifest_sha256:
        description: 'SHA-256 of candidate-manifest.json'
        required: true
        type: string
      source_commit:
        description: 'Exact producer source commit'
        required: true
        type: string
      release_version:
        description: 'Candidate release version without v prefix'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  run-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out producer gate tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact producer candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ inputs.release_version }}-${{ inputs.candidate_run_id }}
          path: ${{ runner.temp }}/capture-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Dispatch, track, and verify consumer gates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CAPTURE_CONSUMER_GATE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          node tools/run-consumer-gates.ts \
            --config .github/consumer-gates.json \
            --candidate "$RUNNER_TEMP/capture-candidate" \
            --candidate-id "${{ inputs.candidate_id }}" \
            --candidate-manifest-sha256 "${{ inputs.candidate_manifest_sha256 }}" \
            --source-commit "${{ inputs.source_commit }}" \
            --release-version "${{ inputs.release_version }}" \
            --producer-repository "${{ github.repository }}" \
            --producer-run-id "${{ inputs.candidate_run_id }}" \
            --output "$RUNNER_TEMP/consumer-gate-ledger.json"

      - name: Upload independent consumer gate ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-gate-ledger-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/consumer-gate-ledger.json
          if-no-files-found: error
          retention-days: 14
