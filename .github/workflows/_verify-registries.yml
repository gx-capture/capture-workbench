name: Reusable Capture Registry Verification

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      candidate_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
      publication_scope:
        required: true
        type: string
      release_candidate_id:
        description: 'Full release candidate ID shared by all source ledgers'
        required: false
        default: ''
        type: string
      package_candidate_id:
        description: 'Package Candidate ID expected for the npm ledger'
        required: false
        default: ''
        type: string
      runtime_candidate_id:
        description: 'Runtime Candidate ID expected for PyPI and crates.io ledgers'
        required: false
        default: ''
        type: string
      java_candidate_id:
        description: 'Java SDK Candidate ID expected for the Maven ledger'
        required: true
        type: string
      package_candidate_manifest_sha256:
        description: 'Package Candidate manifest digest expected for npm'
        required: true
        type: string
      java_candidate_manifest_sha256:
        description: 'Java SDK Candidate manifest digest expected for Maven'
        required: true
        type: string
      runtime_candidate_manifest_sha256:
        description: 'Runtime Candidate manifest digest expected for PyPI and crates.io'
        required: true
        type: string
      contract_set_sha256:
        description: 'Canonical v2 contract-set hash shared by all ledgers'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification tooling at the candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download per-registry publication ledgers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: registry-ledger-*-${{ inputs.candidate_id }}
          path: registry-ledgers
          merge-multiple: true

      - name: Verify publication ledger completeness
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-registry-ledgers.ts \
            --directory registry-ledgers \
            --candidate-id '${{ inputs.candidate_id }}' \
            --release-version '${{ inputs.release_version }}' \
            --scope '${{ inputs.publication_scope }}' \
            --release-candidate-id '${{ inputs.release_candidate_id }}' \
            --package-candidate-id '${{ inputs.package_candidate_id }}' \
            --runtime-candidate-id '${{ inputs.runtime_candidate_id }}' \
            --java-candidate-id '${{ inputs.java_candidate_id }}' \
            --package-candidate-manifest-sha256 '${{ inputs.package_candidate_manifest_sha256 }}' \
            --java-candidate-manifest-sha256 '${{ inputs.java_candidate_manifest_sha256 }}' \
            --runtime-candidate-manifest-sha256 '${{ inputs.runtime_candidate_manifest_sha256 }}' \
            --contract-set-sha256 '${{ inputs.contract_set_sha256 }}'
