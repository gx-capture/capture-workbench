name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable release tag to retry'
        required: true
        type: string
      publication_scope:
        description: 'Registry publication scope for this run'
        required: true
        default: all
        type: choice
        options:
          - all
          - npm
          - pypi
          - crates
      candidate_run_id:
        description: 'Prior successful workflow run ID whose verified candidate must be reused for recovery'
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_scope || 'all' }}
  CANDIDATE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id || '' }}

concurrency:
  group: capture-workbench-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit belongs to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify refs/remotes/origin/main
          $releaseCommit = (git rev-parse HEAD).Trim()
          $PSNativeCommandUseErrorActionPreference = $false
          git merge-base --is-ancestor $releaseCommit refs/remotes/origin/main
          $ancestorExitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($ancestorExitCode -ne 0) {
            throw "Release tag commit must be reachable from origin/main."
          }

      - name: Check out recovery source for the crate-only metadata correction
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '' && inputs.publication_scope == 'crates' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          path: recovery-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify recovery source only changes the launcher metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '' && inputs.publication_scope == 'crates' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseCommit = (git rev-list -n 1 "$env:RELEASE_TAG").Trim()
          $recoveryCommit = (git -C recovery-source rev-parse HEAD).Trim()
          git -C recovery-source merge-base --is-ancestor $releaseCommit $recoveryCommit
          if ($LASTEXITCODE -ne 0) {
            throw "Recovery source must descend from the immutable release tag."
          }
          $changed = @(git -C recovery-source diff --name-only $releaseCommit -- packages/capture-sidecar-launcher/Cargo.toml)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'packages/capture-sidecar-launcher/Cargo.toml') {
            throw "Crate recovery may change only the launcher Cargo metadata."
          }
          $cargo = Get-Content recovery-source/packages/capture-sidecar-launcher/Cargo.toml -Raw
          if ($cargo -notmatch 'categories = \["os"\]') {
            throw "Recovery source does not contain the supported crates.io category."
          }

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Verify successful exact-commit main CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseCommit = (git rev-parse HEAD).Trim()
          node tools/verify-main-ci.ts `
            --repository "$env:GITHUB_REPOSITORY" `
            --commit "$releaseCommit" `
            --workflow-path ".github/workflows/ci.yml" `
            --branch "main"

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: ${{ inputs.candidate_run_id == '' }}

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized versions
        shell: pwsh
        run: pnpm verify:release-version -- "$env:RELEASE_TAG"

      - name: Classify canonical release model mode
        if: ${{ inputs.candidate_run_id == '' }}
        id: release-model-mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-runtime:classify-release-model-mode
          $classification = Get-Content `
            packages/capture-runtime/dist/metadata/release-model-mode.json `
            -Raw | ConvertFrom-Json
          if ($classification.releaseMode -notin @('core-only', 'model-enabled')) {
            throw "Release model mode classification is invalid."
          }
          "mode=$($classification.releaseMode)" >> $env:GITHUB_OUTPUT

      - name: Build production runtime artifacts without ambient model stores
        if: ${{ inputs.candidate_run_id == '' }}
        shell: pwsh
        run: pnpm nx run capture-runtime:build-release-artifacts

      - name: Build Capture Workbench Windows installer with the verified release runtime
        if: ${{ inputs.candidate_run_id == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/capture-workbench-desktop/scripts/stage-runtime.ts `
            --artifact packages/capture-runtime/dist/release/capture-runtime-x86_64-pc-windows-msvc.exe `
            --manifest packages/capture-runtime/dist/release/capture-runtime-manifest.json `
            --schema packages/capture-runtime/dist/release/capture-document-v1.schema.json `
            --source release
          pnpm nx run capture-workbench-desktop:build-nsis

      - name: Measure exact installed size
        if: ${{ inputs.candidate_run_id == '' }}
        shell: pwsh
        run: node apps/capture-workbench-desktop/scripts/installed-deterministic-smoke.ts --measure-release-size

      - name: Verify exact installed size and packaging budgets
        if: ${{ inputs.candidate_run_id == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-runtime:size-regression-check
          $report = 'packages/capture-runtime/dist/size/runtime-size-report.json'
          $releasedReport = 'packages/capture-runtime/dist/release/runtime-size-report.json'
          Copy-Item -LiteralPath $report -Destination $releasedReport
          $digest = (Get-FileHash -LiteralPath $releasedReport -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  runtime-size-report.json" | Set-Content -LiteralPath "$releasedReport.sha256" -Encoding utf8NoBOM

      - name: Assemble release candidate
        if: ${{ inputs.candidate_run_id == '' }}
        shell: pwsh
        env:
          RELEASE_MODEL_MODE: ${{ steps.release-model-mode.outputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-angular:pack
          pnpm nx run capture-contracts:pack
          pnpm nx run capture-structuring:pack
          pnpm nx run capture-contracts:python-build
          pnpm nx run capture-structuring-python:build
          pnpm nx run capture-sidecar-launcher:cargo-package-dry-run
          $packages = @(Get-ChildItem dist/packs -Filter '*.tgz' -File)
          if ($packages.Count -ne 3) {
            throw "Expected exactly three release package tarballs, found $($packages.Count)."
          }
          $candidate = Join-Path $env:RUNNER_TEMP 'capture-candidate'
          $runtime = Join-Path $candidate 'runtime'
          $package = Join-Path $candidate 'package'
          $python = Join-Path $candidate 'python'
          $crate = Join-Path $candidate 'crate'
          $checksums = Join-Path $candidate 'checksums'
          $desktop = Join-Path $candidate 'desktop'
          New-Item -ItemType Directory -Path $runtime, $package, $python, $crate, $checksums, $desktop | Out-Null
          Copy-Item packages/capture-runtime/dist/release/* -Destination $runtime
          if ($env:RELEASE_MODEL_MODE -notin @('core-only', 'model-enabled')) {
            throw "Release model mode classification is invalid."
          }
          foreach ($packageTarball in $packages) {
            Copy-Item $packageTarball.FullName -Destination $package
          }
          $pythonArtifacts = @(
            Get-ChildItem packages/capture-contracts/python/dist, packages/capture-structuring-python/dist -File |
              Where-Object { $_.Name -match '^(capture_contracts|capture_structuring)-\d+\.\d+\.\d+(?:-[^/]+)?\.(?:whl|tar\.gz)$' }
          )
          if ($pythonArtifacts.Count -ne 4) {
            throw "Expected exactly four Python distribution artifacts, found $($pythonArtifacts.Count)."
          }
          foreach ($pythonArtifact in $pythonArtifacts) {
            Copy-Item $pythonArtifact.FullName -Destination $python
          }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH."
          }
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $crateArtifact = Get-Item "packages/capture-sidecar-launcher/target/package/capture-sidecar-launcher-$releaseVersion.crate"
          Copy-Item $crateArtifact.FullName -Destination $crate
          foreach ($artifact in @(Get-ChildItem $package, $python, $crate -File)) {
            $digest = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($artifact.Name)" | Set-Content -LiteralPath (Join-Path $checksums "$($artifact.Name).sha256") -Encoding utf8NoBOM
          }
          $installers = @(Get-ChildItem apps/capture-workbench-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*.exe' -File -Recurse)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Capture Workbench NSIS installer, found $($installers.Count)."
          }
          $canonicalInstallerName = "Capture.Workbench_${releaseVersion}_x64-setup.exe"
          if ($canonicalInstallerName -notmatch '^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?$') {
            throw "Canonical release installer name is not GitHub-stable."
          }
          $stagedInstaller = Join-Path $desktop $canonicalInstallerName
          Copy-Item -LiteralPath $installers[0].FullName -Destination $stagedInstaller
          $sourceInstaller = Get-Item -LiteralPath $installers[0].FullName
          $sourceDigest = (Get-FileHash -LiteralPath $sourceInstaller.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $stagedInstallerInfo = Get-Item -LiteralPath $stagedInstaller
          $stagedDigest = (Get-FileHash -LiteralPath $stagedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceInstaller.Length -ne $stagedInstallerInfo.Length -or $sourceDigest -ne $stagedDigest) {
            throw "Canonical staged installer bytes differ from the Tauri-generated installer."
          }
          $sizeReportPath = Join-Path $runtime 'runtime-size-report.json'
          $sizeReport = Get-Content -LiteralPath $sizeReportPath -Raw | ConvertFrom-Json
          if (
            $sizeReport.nsisInstaller.fileName -ne $sourceInstaller.Name -or
            $sizeReport.nsisInstaller.bytes -ne $sourceInstaller.Length -or
            $sizeReport.nsisInstaller.sha256 -ne $sourceDigest
          ) {
            throw "Installed-size report does not bind the Tauri-generated installer."
          }
          $sizeReport.nsisInstaller = [ordered]@{
            path = "desktop/$canonicalInstallerName"
            fileName = $canonicalInstallerName
            bytes = $stagedInstallerInfo.Length
            sha256 = $stagedDigest
          }
          $sizeReport | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $sizeReportPath -Encoding utf8NoBOM
          $sizeReportDigest = (Get-FileHash -LiteralPath $sizeReportPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sizeReportDigest  runtime-size-report.json" | Set-Content -LiteralPath "$sizeReportPath.sha256" -Encoding utf8NoBOM
          node tools/verify-release-candidate.ts --candidate "$candidate" --version "$releaseVersion"
          "CAPTURE_CANDIDATE_PATH=$candidate" >> $env:GITHUB_ENV

      - name: Download immutable candidate from prior successful run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/capture-candidate-reused
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Rebuild corrected crate candidate without rebuilding runtime assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '' && inputs.publication_scope == 'crates' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          cargo package --manifest-path recovery-source/packages/capture-sidecar-launcher/Cargo.toml --allow-dirty
          $crateArtifact = Get-Item "recovery-source/packages/capture-sidecar-launcher/target/package/capture-sidecar-launcher-$releaseVersion.crate"
          $candidateCrate = Join-Path $env:RUNNER_TEMP 'capture-candidate-reused/crate'
          $candidateChecksums = Join-Path $env:RUNNER_TEMP 'capture-candidate-reused/checksums'
          Get-ChildItem $candidateCrate -Filter '*.crate' -File | Remove-Item -Force
          Copy-Item -LiteralPath $crateArtifact.FullName -Destination $candidateCrate
          $digest = (Get-FileHash -LiteralPath (Join-Path $candidateCrate $crateArtifact.Name) -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $candidateChecksums "$($crateArtifact.Name).sha256"
          Set-Content -LiteralPath $checksumPath -Value "$digest  $($crateArtifact.Name)" -Encoding utf8NoBOM

      - name: Verify reused release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $candidate = Join-Path $env:RUNNER_TEMP 'capture-candidate-reused'
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          node tools/verify-release-candidate.ts --candidate "$candidate" --version "$releaseVersion"
          "CAPTURE_CANDIDATE_PATH=$candidate" >> $env:GITHUB_ENV

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-candidate-${{ env.RELEASE_TAG }}
          path: ${{ env.CAPTURE_CANDIDATE_PATH }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-npm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publication_scope == 'all' || inputs.publication_scope == 'npm' }}
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out publication scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ env.RELEASE_TAG }}
          path: publication

      - name: Install publication script dependencies
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish runtime first, then the exact release packages idempotently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @(Get-ChildItem publication/package -Filter '*.tgz' -File)
          if ($packages.Count -ne 3) {
            throw "Expected exactly three release package tarballs, found $($packages.Count)."
          }
          $installers = @(Get-ChildItem publication/desktop -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Capture Workbench NSIS installer, found $($installers.Count)."
          }
          $packageArgs = @()
          foreach ($package in $packages) {
            $packageArgs += @('--package', $package.FullName)
          }
          node tools/publish-release.ts `
            --tag "$env:RELEASE_TAG" `
            --runtime-dir publication/runtime `
            --installer $installers[0].FullName `
            @packageArgs

      - name: Record npm publication completion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ledger = Get-Content publication/release-ledger.json -Raw | ConvertFrom-Json
          $ledger.status = 'npm-published'
          $ledger | ConvertTo-Json -Depth 10 | Set-Content publication/release-ledger-npm.json -Encoding utf8NoBOM

      - name: Upload npm publication ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-release-ledger-npm-${{ env.RELEASE_TAG }}
          path: publication/release-ledger-npm.json
          if-no-files-found: error

  publish-pypi:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publication_scope == 'all' || inputs.publication_scope == 'pypi' }}
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: capture-contracts
            prefix: capture_contracts
            module: capture_contracts
            environment: pypi
          - project: capture-structuring
            prefix: capture_structuring
            module: capture_structuring
            environment: pypi-structuring
    environment:
      name: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ env.RELEASE_TAG }}
          path: publication

      - name: Isolate this package's distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "publication/python/${{ matrix.project }}"
          count="$(find publication/python -maxdepth 1 -type f -name '${{ matrix.prefix }}-*' | wc -l)"
          test "$count" -eq 2
          find publication/python -maxdepth 1 -type f -name '${{ matrix.prefix }}-*' \
            -exec cp {} "publication/python/${{ matrix.project }}/" \;

      - name: Publish this Python distribution with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publication/python/${{ matrix.project }}
          skip-existing: true

      - name: Probe this PyPI import from a clean environment
        shell: bash
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
          PYPI_PROJECT: ${{ matrix.project }}
          PROBE_MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          probe_dir="$RUNNER_TEMP/${PYPI_PROJECT}-probe"
          python -m venv "$probe_dir"
          "$probe_dir/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            "${PYPI_PROJECT}==${version}"
          "$probe_dir/bin/python" -c \
            'import importlib, os; module = importlib.import_module(os.environ["PROBE_MODULE"]); assert module.__package__ == os.environ["PROBE_MODULE"]'

      - name: Verify immutable PyPI artifact digests for this project
        shell: bash
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
          PYPI_PROJECT: ${{ matrix.project }}
          ARTIFACT_PREFIX: ${{ matrix.prefix }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          version = os.environ['RELEASE_VERSION'].removeprefix('v')
          project = os.environ['PYPI_PROJECT']
          prefix = os.environ['ARTIFACT_PREFIX']
          ledger = json.loads(Path('publication/release-ledger.json').read_text())
          expected = {
              item['name']: item['sha256']
              for item in ledger['artifacts']
              if item['registry'] == 'pypi' and item['name'].startswith(f'{prefix}-')
          }
          if not expected:
              raise SystemExit(f'No candidate artifacts recorded for {project}.')
          with urlopen(f'https://pypi.org/pypi/{project}/{version}/json', timeout=30) as response:
              remote = json.load(response)
          remote_digests = {
              item['filename']: item['digests']['sha256']
              for item in remote['urls']
              if item['filename'] in expected
          }
          if remote_digests != expected:
              raise SystemExit(
                  f'PyPI digest mismatch for {project}: expected {expected}, got {remote_digests}'
              )
          print(f'PyPI digests verified for {project} {version}.')
          PY

      - name: Record PyPI publication completion for this project
        shell: bash
        env:
          PYPI_PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('publication/release-ledger.json')
          ledger = json.loads(path.read_text())
          project = os.environ['PYPI_PROJECT']
          ledger['status'] = f'pypi-{project}-published'
          Path(f'publication/release-ledger-pypi-{project}.json').write_text(
              json.dumps(ledger, indent=2) + '\n'
          )
          PY

      - name: Upload this PyPI publication ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-release-ledger-pypi-${{ matrix.project }}-${{ env.RELEASE_TAG }}
          path: publication/release-ledger-pypi-${{ matrix.project }}.json
          if-no-files-found: error

  publish-crates-io:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publication_scope == 'all' || inputs.publication_scope == 'crates' }}
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ env.RELEASE_TAG }}
          path: publication

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Validate the exact crate candidate with Cargo
        shell: bash
        run: |
          set -euo pipefail
          cargo publish --manifest-path packages/capture-sidecar-launcher/Cargo.toml --locked --dry-run

      - name: Publish launcher to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          expected_sha256="$(python -c 'import json; print(next(item["sha256"] for item in json.load(open("publication/release-ledger.json"))["artifacts"] if item["registry"] == "crates.io"))')"
          version="${RELEASE_TAG#v}"
          archive_path="$RUNNER_TEMP/capture-sidecar-launcher-${version}.crate"
          archive_status="$(curl --silent --show-error --location --retry 3 --retry-delay 2 --user-agent "gx-capture-release/${RELEASE_TAG} (https://github.com/gx-capture/capture-workbench)" --output "$archive_path" --write-out '%{http_code}' "https://static.crates.io/crates/capture-sidecar-launcher/capture-sidecar-launcher-${version}.crate" || true)"
          if [ "$archive_status" = '200' ]; then
            remote_sha256="$(sha256sum "$archive_path" | cut -d ' ' -f1)"
            test "$remote_sha256" = "$expected_sha256"
          elif [ "$archive_status" = '404' ]; then
            test -n "$CARGO_REGISTRY_TOKEN"
            cargo publish --manifest-path packages/capture-sidecar-launcher/Cargo.toml --locked --token "$CARGO_REGISTRY_TOKEN"
          else
            echo "Unexpected crates.io static archive status: $archive_status" >&2
            exit 1
          fi

      - name: Probe the published crate index
        shell: bash
        run: |
          set -euo pipefail
          cargo info "capture-sidecar-launcher@${RELEASE_TAG#v}"

      - name: Record crates.io publication completion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('publication/release-ledger.json')
          ledger = json.loads(path.read_text())
          ledger['status'] = 'crates-io-published'
          Path('publication/release-ledger-crates-io.json').write_text(json.dumps(ledger, indent=2) + '\n')
          PY

      - name: Upload crates.io publication ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-release-ledger-crates-io-${{ env.RELEASE_TAG }}
          path: publication/release-ledger-crates-io.json
          if-no-files-found: error

  registry-release-gate:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publication_scope == 'all') && needs.publish-npm.result == 'success' && needs.publish-pypi.result == 'success' && needs.publish-crates-io.result == 'success' }}
    needs: [publish-npm, publish-pypi, publish-crates-io]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ env.RELEASE_TAG }}
          path: publication

      - name: Download per-registry publication ledgers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: capture-release-ledger-*-${{ env.RELEASE_TAG }}
          path: publication/ledgers
          merge-multiple: true

      - name: Verify the release ledger and registry probes completed
        shell: bash
        run: |
          set -euo pipefail
          test -f publication/release-ledger.json
          test "$(python -c 'import json; print(json.load(open("publication/release-ledger.json"))["status"])')" = candidate-verified
          test -f publication/ledgers/release-ledger-npm.json
          test -f publication/ledgers/release-ledger-pypi-capture-contracts.json
          test -f publication/ledgers/release-ledger-pypi-capture-structuring.json
          test -f publication/ledgers/release-ledger-crates-io.json
          test "$(python -c 'import json; print(json.load(open("publication/ledgers/release-ledger-npm.json"))["status"])')" = npm-published
          test "$(python -c 'import json; print(json.load(open("publication/ledgers/release-ledger-pypi-capture-contracts.json"))["status"])')" = pypi-capture-contracts-published
          test "$(python -c 'import json; print(json.load(open("publication/ledgers/release-ledger-pypi-capture-structuring.json"))["status"])')" = pypi-capture-structuring-published
          test "$(python -c 'import json; print(json.load(open("publication/ledgers/release-ledger-crates-io.json"))["status"])')" = crates-io-published
          test -n "${RELEASE_TAG#v}"

  recovery-registry-gate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publication_scope != 'all' && ((inputs.publication_scope == 'npm' && needs.publish-npm.result == 'success') || (inputs.publication_scope == 'pypi' && needs.publish-pypi.result == 'success') || (inputs.publication_scope == 'crates' && needs.publish-crates-io.result == 'success')) }}
    needs: [publish-npm, publish-pypi, publish-crates-io]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Download current recovery candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ env.RELEASE_TAG }}
          path: publication

      - name: Install publication verification dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Probe immutable GitHub Release and npm registry state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(find publication/package -maxdepth 1 -type f -name '*.tgz' -print | sort)
          installer="$(find publication/desktop -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$installer"
          node tools/publish-release.ts \
            --tag "$RELEASE_TAG" \
            --runtime-dir publication/runtime \
            --installer "$installer" \
            "${package_args[@]}"

      - name: Probe clean PyPI installation and generated imports
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          probe_dir="$RUNNER_TEMP/capture-pypi-recovery-probe"
          uv venv "$probe_dir"
          uv pip install --python "$probe_dir/bin/python" --index-url https://pypi.org/simple \
            "capture-contracts==${version}" "capture-structuring==${version}"
          "$probe_dir/bin/python" - <<'PY'
          import capture_contracts
          import capture_structuring
          assert capture_contracts.__package__ == 'capture_contracts'
          assert capture_structuring.__package__ == 'capture_structuring'
          PY

      - name: Probe clean crates.io installation and immutable checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected_sha256="$(python -c 'import json; print(next(item["sha256"] for item in json.load(open("publication/release-ledger.json"))["artifacts"] if item["registry"] == "crates.io"))')"
          archive_path="$RUNNER_TEMP/capture-sidecar-launcher-${version}.crate"
          curl --silent --show-error --fail --location --retry 5 --retry-delay 3 \
            --user-agent "gx-capture-release/${RELEASE_TAG} (https://github.com/gx-capture/capture-workbench)" \
            --output "$archive_path" \
            "https://static.crates.io/crates/capture-sidecar-launcher/capture-sidecar-launcher-${version}.crate"
          remote_sha256="$(sha256sum "$archive_path" | cut -d ' ' -f1)"
          test "$remote_sha256" = "$expected_sha256"
          cargo info "capture-sidecar-launcher@${version}"
          probe_dir="$RUNNER_TEMP/capture-launcher-recovery-probe"
          cargo init --lib --name capture_launcher_recovery_probe "$probe_dir" >/dev/null
          python - "$probe_dir/Cargo.toml" "$version" <<'PY'
          import sys
          from pathlib import Path
          path, version = sys.argv[1:]
          Path(path).write_text(
              '[package]\nname = "capture_launcher_recovery_probe"\nversion = "0.1.0"\nedition = "2021"\n\n'
              '[dependencies]\n'
              f'capture-sidecar-launcher = "={version}"\n',
              encoding='utf-8',
          )
          PY
          cargo generate-lockfile --manifest-path "$probe_dir/Cargo.toml"
          cargo check --manifest-path "$probe_dir/Cargo.toml" --locked

      - name: Record complete registry recovery ledger
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_SCOPE: ${{ inputs.publication_scope }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('publication/release-ledger.json')
          ledger = json.loads(path.read_text())
          ledger['status'] = 'registry-recovery-complete'
          ledger['recovery'] = {
              'candidateRunId': os.environ['CANDIDATE_RUN_ID'],
              'scope': os.environ['RELEASE_SCOPE'],
              'verifiedRegistries': ['npm', 'pypi', 'crates.io'],
          }
          Path('publication/release-ledger-recovery.json').write_text(
              json.dumps(ledger, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload complete registry recovery ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-release-ledger-recovery-${{ env.RELEASE_TAG }}
          path: publication/release-ledger-recovery.json
          if-no-files-found: error
