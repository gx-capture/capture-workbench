name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: capture-workbench-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit belongs to main
        shell: pwsh
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify refs/remotes/origin/main
          git merge-base --is-ancestor "$env:GITHUB_SHA" refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag commit must be reachable from origin/main."
          }

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized versions
        shell: pwsh
        run: pnpm verify:release-version -- "${{ github.ref_name }}"

      - name: Verify the complete workspace release gate
        shell: pwsh
        run: pnpm verify

      - name: Build production runtime artifacts without ambient model stores
        shell: pwsh
        run: pnpm nx run capture-runtime:build-release-artifacts

      - name: Build Capture Workbench Windows installer with the verified release runtime
        shell: pwsh
        run: |
          node apps/capture-workbench-desktop/scripts/stage-runtime.ts `
            --artifact packages/capture-runtime/dist/release/capture-runtime-x86_64-pc-windows-msvc.exe `
            --manifest packages/capture-runtime/dist/release/capture-runtime-manifest.json `
            --schema packages/capture-runtime/dist/release/capture-document-v1.schema.json `
            --source release
          pnpm nx run capture-workbench-desktop:build-nsis

      - name: Verify exact installed size and packaging budgets
        shell: pwsh
        run: |
          node apps/capture-workbench-desktop/scripts/installed-deterministic-smoke.ts --measure-release-size
          pnpm nx run capture-runtime:size-regression-check
          $report = 'packages/capture-runtime/dist/size/runtime-size-report.json'
          $releasedReport = 'packages/capture-runtime/dist/release/runtime-size-report.json'
          Copy-Item -LiteralPath $report -Destination $releasedReport
          $digest = (Get-FileHash -LiteralPath $releasedReport -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  runtime-size-report.json" | Set-Content -LiteralPath "$releasedReport.sha256" -Encoding utf8NoBOM

      - name: Assemble release candidate
        shell: pwsh
        run: |
          pnpm nx run capture-angular:pack
          $packages = @(Get-ChildItem dist/packs -Filter '*.tgz' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Capture Workbench tarball, found $($packages.Count)."
          }
          $candidate = Join-Path $env:RUNNER_TEMP 'capture-candidate'
          $runtime = Join-Path $candidate 'runtime'
          $package = Join-Path $candidate 'package'
          $desktop = Join-Path $candidate 'desktop'
          New-Item -ItemType Directory -Path $runtime, $package, $desktop | Out-Null
          Copy-Item packages/capture-runtime/dist/release/* -Destination $runtime
          Copy-Item $packages[0].FullName -Destination $package
          $installers = @(Get-ChildItem apps/capture-workbench-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*.exe' -File -Recurse)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Capture Workbench NSIS installer, found $($installers.Count)."
          }
          Copy-Item $installers[0].FullName -Destination $desktop
          "CAPTURE_CANDIDATE_PATH=$candidate" >> $env:GITHUB_ENV

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-candidate-${{ github.ref_name }}
          path: ${{ env.CAPTURE_CANDIDATE_PATH }}
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out publication scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ github.ref_name }}
          path: publication

      - name: Install publication script dependencies
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish runtime first, then the exact Capture Workbench package idempotently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem publication/package -Filter '*.tgz' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one release package tarball, found $($packages.Count)."
          }
          $installers = @(Get-ChildItem publication/desktop -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Capture Workbench NSIS installer, found $($installers.Count)."
          }
          node tools/publish-release.ts `
            --tag "${{ github.ref_name }}" `
            --runtime-dir publication/runtime `
            --installer $installers[0].FullName `
            --package $packages[0].FullName
