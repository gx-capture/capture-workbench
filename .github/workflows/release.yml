name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: capture-workbench-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: capture-release-build
    permissions:
      contents: read
      packages: read
    env:
      CAPTURE_WINDOWSML_BUNDLE_URL: ${{ vars.CAPTURE_WINDOWSML_BUNDLE_URL }}
      CAPTURE_WINDOWSML_BUNDLE_SHA256: ${{ vars.CAPTURE_WINDOWSML_BUNDLE_SHA256 }}
      CAPTURE_WINDOWSML_BUNDLE_BYTES: ${{ vars.CAPTURE_WINDOWSML_BUNDLE_BYTES }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gx'

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized versions
        shell: pwsh
        run: pnpm verify:release-version -- "${{ github.ref_name }}"

      - name: Verify Capture Workbench package
        shell: pwsh
        run: |
          pnpm nx run capture-angular:lint
          pnpm nx run capture-angular:test
          pnpm nx run capture-angular:clean-consumer-smoke

      - name: Build production runtime artifacts without ambient model stores
        shell: pwsh
        run: |
          pnpm nx run capture-runtime:lint
          pnpm nx run capture-runtime:typecheck
          pnpm nx run capture-runtime:test
          pnpm nx run capture-runtime:build-release-artifacts

      - name: Build the non-public Tauri verification installer
        shell: pwsh
        run: |
          node apps/capture-workbench-desktop/scripts/stage-runtime.ts `
            --artifact packages/capture-runtime/dist/release/capture-runtime-x86_64-pc-windows-msvc.exe `
            --manifest packages/capture-runtime/dist/release/capture-runtime-manifest.json `
            --schema packages/capture-runtime/dist/release/capture-document-v1.schema.json `
            --source release
          pnpm nx run capture-workbench-desktop:build-nsis-release

      - name: Assemble immutable clean-install candidate
        shell: pwsh
        run: |
          pnpm nx run capture-angular:pack
          $packages = @(Get-ChildItem dist/packs -Filter '*.tgz' -File)
          $installers = @(Get-ChildItem `
            apps/capture-workbench-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis `
            -Filter '*.exe' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Capture Workbench tarball, found $($packages.Count)."
          }
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $candidate = Join-Path $env:RUNNER_TEMP 'capture-candidate'
          $runtime = Join-Path $candidate 'runtime'
          $package = Join-Path $candidate 'package'
          $installer = Join-Path $candidate 'installer'
          New-Item -ItemType Directory -Path $runtime, $package, $installer | Out-Null
          Copy-Item packages/capture-runtime/dist/release/* -Destination $runtime
          Copy-Item $packages[0].FullName -Destination $package
          Copy-Item $installers[0].FullName -Destination $installer
          "CAPTURE_CANDIDATE_PATH=$candidate" >> $env:GITHUB_ENV

      - name: Upload immutable clean-install candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-candidate-${{ github.ref_name }}
          path: ${{ env.CAPTURE_CANDIDATE_PATH }}
          if-no-files-found: error
          retention-days: 3

  verify-clean-install-evidence:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 30
    environment: capture-release
    permissions:
      attestations: read
      contents: read
      packages: read
    env:
      CAPTURE_WINDOWSML_BUNDLE_URL: ${{ vars.CAPTURE_WINDOWSML_BUNDLE_URL }}
      CAPTURE_WINDOWSML_BUNDLE_SHA256: ${{ vars.CAPTURE_WINDOWSML_BUNDLE_SHA256 }}
      CAPTURE_WINDOWSML_BUNDLE_BYTES: ${{ vars.CAPTURE_WINDOWSML_BUNDLE_BYTES }}
      CAPTURE_RELEASE_EVIDENCE_SIGNER_WORKFLOW: ${{ vars.CAPTURE_RELEASE_EVIDENCE_SIGNER_WORKFLOW }}

    steps:
      - name: Check out verification code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Download the exact candidate that clean-install must exercise
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ github.ref_name }}
          path: candidate

      - name: Materialize protected evidence and fixture registry
        shell: pwsh
        env:
          CAPTURE_RELEASE_EVIDENCE_B64: ${{ secrets.CAPTURE_RELEASE_EVIDENCE_B64 }}
          CAPTURE_RELEASE_FIXTURE_REGISTRY_B64: ${{ secrets.CAPTURE_RELEASE_FIXTURE_REGISTRY_B64 }}
        run: |
          $inputs = @(
            @('CAPTURE_RELEASE_EVIDENCE_B64', 'capture-release-evidence.json', 'CAPTURE_RELEASE_EVIDENCE_PATH'),
            @('CAPTURE_RELEASE_FIXTURE_REGISTRY_B64', 'capture-release-fixture-registry.json', 'CAPTURE_RELEASE_FIXTURE_REGISTRY_PATH')
          )
          foreach ($input in $inputs) {
            $encoded = [Environment]::GetEnvironmentVariable($input[0])
            if ([string]::IsNullOrWhiteSpace($encoded)) {
              throw "$($input[0]) is required in the protected capture-release environment."
            }
            try {
              $bytes = [Convert]::FromBase64String($encoded)
            } catch {
              throw "$($input[0]) is not valid Base64."
            }
            $path = Join-Path $env:RUNNER_TEMP $input[1]
            [IO.File]::WriteAllBytes($path, $bytes)
            "$($input[2])=$path" >> $env:GITHUB_ENV
          }

      - name: Bind candidate paths for the exact-artifact preflight
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem candidate/installer -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one candidate installer, found $($installers.Count)."
          }
          "CAPTURE_RELEASE_INSTALLER_PATH=$($installers[0].FullName)" >> $env:GITHUB_ENV
          "CAPTURE_RELEASE_RUNTIME_PATH=$((Resolve-Path 'candidate/runtime/capture-runtime-x86_64-pc-windows-msvc.exe').Path)" >> $env:GITHUB_ENV
          "CAPTURE_RELEASE_SCHEMA_PATH=$((Resolve-Path 'candidate/runtime/capture-document-v1.schema.json').Path)" >> $env:GITHUB_ENV
          "CAPTURE_RELEASE_MANIFEST_PATH=$((Resolve-Path 'candidate/runtime/capture-runtime-manifest.json').Path)" >> $env:GITHUB_ENV

      - name: Verify GitHub attestation for the exact evidence subject
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CAPTURE_RELEASE_EVIDENCE_SIGNER_WORKFLOW)) {
            throw 'CAPTURE_RELEASE_EVIDENCE_SIGNER_WORKFLOW is required in the protected environment.'
          }
          gh attestation verify $env:CAPTURE_RELEASE_EVIDENCE_PATH `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow $env:CAPTURE_RELEASE_EVIDENCE_SIGNER_WORKFLOW
          'CAPTURE_RELEASE_ATTESTATION_VERIFIED=true' >> $env:GITHUB_ENV

      - name: Fail closed unless exact candidate matches clean-install evidence
        shell: pwsh
        run: pnpm nx run capture-runtime:production-preflight

      - name: Assemble the verified public payload
        shell: pwsh
        run: |
          $publication = Join-Path $env:RUNNER_TEMP 'capture-publication'
          New-Item -ItemType Directory -Path $publication | Out-Null
          Copy-Item candidate/runtime -Destination $publication -Recurse
          Copy-Item candidate/package -Destination $publication -Recurse
          "CAPTURE_PUBLICATION_PATH=$publication" >> $env:GITHUB_ENV

      - name: Upload verified publication payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-publication-${{ github.ref_name }}
          path: ${{ env.CAPTURE_PUBLICATION_PATH }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-clean-install-evidence
    runs-on: windows-latest
    timeout-minutes: 20
    environment: capture-release-publish
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out publication scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gx'

      - name: Download verified publication payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-publication-${{ github.ref_name }}
          path: publication

      - name: Publish runtime first, then the exact Capture Workbench package idempotently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem publication/package -Filter '*.tgz' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one verified package tarball, found $($packages.Count)."
          }
          node tools/publish-release.ts `
            --tag "${{ github.ref_name }}" `
            --runtime-dir publication/runtime `
            --package $packages[0].FullName
