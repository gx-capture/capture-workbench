name: Reusable Capture Runtime GitHub Release Publication

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      candidate_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
      tag:
        required: true
        type: string
      tooling_commit:
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: capture-github-release
    steps:
      - name: Check out release tooling at the promotion workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tooling_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the prepared immutable Runtime Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: promotion-input-${{ inputs.candidate_id }}
          path: promotion-input

      - name: Fetch and verify the tag created after producer registries pass
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"
          test "$(git rev-list -n 1 '${{ inputs.tag }}^{}')" = '${{ inputs.source_commit }}'

      - name: Create or verify the public Runtime GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/create-runtime-github-release.ts \
            --candidate promotion-input/candidate \
            --tag '${{ inputs.tag }}' \
            --source-commit '${{ inputs.source_commit }}' \
            --output runtime-github-release-ledger.json

      - name: Attest the Runtime Candidate assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            promotion-input/candidate/runtime/**
            promotion-input/candidate/candidate-manifest.json

      - name: Upload Runtime GitHub Release ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-runtime-release-ledger-${{ inputs.candidate_id }}
          path: runtime-github-release-ledger.json
          if-no-files-found: error
          retention-days: 14
