name: Release Promotion

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful release-candidate workflow run containing the immutable candidate'
        required: true
        type: string
      package_candidate_run_id:
        description: 'Successful Release Package Candidate workflow run for the same source commit'
        required: true
        type: string
      package_candidate_id:
        description: 'Immutable Package Candidate ID'
        required: true
        type: string
      package_candidate_manifest_sha256:
        description: 'SHA-256 of the Package Candidate candidate-manifest.json'
        required: true
        type: string
      runtime_candidate_run_id:
        description: 'Successful Release Runtime Candidate workflow run for the same source commit'
        required: true
        type: string
      runtime_candidate_id:
        description: 'Immutable Runtime Candidate ID'
        required: true
        type: string
      runtime_candidate_manifest_sha256:
        description: 'SHA-256 of the Runtime Candidate candidate-manifest.json'
        required: true
        type: string
      package_candidate_version:
        description: 'Package Candidate version without v prefix'
        required: true
        type: string
      candidate_id:
        description: 'Expected candidate identity'
        required: true
        type: string
      consumer_gate_run_id:
        description: 'Successful consumer-gates workflow run for this candidate'
        required: true
        type: string
      publication_scope:
        description: 'Publish all registries, or retry one registry from the same candidate'
        required: true
        default: all
        type: choice
        options:
          - all
          - npm
          - pypi
          - crates
          - maven
      pypi_project:
        description: 'PyPI project lane: runtime client'
        required: false
        default: client
        type: choice
        options:
          - client
      contract_set_sha256:
        description: 'Canonical v2 contract-set SHA-256 for the release train'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: capture-workbench-promotion-${{ inputs.candidate_id }}-${{ inputs.publication_scope }}
  cancel-in-progress: false

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    environment: capture-release-promotion
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.evidence.outputs.source_commit }}
      release_version: ${{ steps.evidence.outputs.release_version }}
      java_candidate_manifest_sha256: ${{ steps.evidence.outputs.java_candidate_manifest_sha256 }}
      java_candidate_id: ${{ steps.evidence.outputs.java_candidate_id }}
      runtime_candidate_manifest_sha256: ${{ steps.evidence.outputs.runtime_candidate_manifest_sha256 }}
    steps:
      - name: Check out promotion tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download every artifact from the exact candidate run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-artifacts

      - name: Download the exact Package Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-package-candidate-${{ inputs.package_candidate_version }}-${{ inputs.package_candidate_run_id }}
          run-id: ${{ inputs.package_candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package-candidate

      - name: Download the exact Runtime Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-runtime-candidate-${{ inputs.package_candidate_version }}-${{ inputs.runtime_candidate_run_id }}
          run-id: ${{ inputs.runtime_candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime-candidate

      - name: Download the exact consumer gate ledger
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: consumer-gate-ledger-${{ inputs.candidate_id }}
          run-id: ${{ inputs.consumer_gate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/consumer-gate

      - name: Verify the Package Candidate and desktop package binding
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$(find "$RUNNER_TEMP/candidate-artifacts" -name candidate-manifest.json -type f -print -quit | xargs dirname)"
          source_commit="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); process.stdout.write(m.sourceCommit)" "$candidate_root/candidate-manifest.json")"
          release_version="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); process.stdout.write(m.releaseVersion)" "$candidate_root/candidate-manifest.json")"
          test "$release_version" = '${{ inputs.package_candidate_version }}'
          node tools/verify-package-candidate.ts \
            --candidate "$RUNNER_TEMP/package-candidate" \
            --version "$release_version" \
            --source-commit "$source_commit" \
           --producer-run-id '${{ inputs.package_candidate_run_id }}' \
           --candidate-id '${{ inputs.package_candidate_id }}' \
           --candidate-manifest-sha256 '${{ inputs.package_candidate_manifest_sha256 }}' \
           --contract-set-sha256 '${{ inputs.contract_set_sha256 }}' \
           --require-evidence
          node tools/verify-runtime-candidate.ts \
            --candidate "$RUNNER_TEMP/runtime-candidate" \
            --version "$release_version" \
            --source-commit "$source_commit" \
            --producer-run-id '${{ inputs.runtime_candidate_run_id }}' \
            --candidate-id '${{ inputs.runtime_candidate_id }}' \
            --candidate-manifest-sha256 '${{ inputs.runtime_candidate_manifest_sha256 }}' \
            --package-candidate-id '${{ inputs.package_candidate_id }}' \
            --contract-set-sha256 '${{ inputs.contract_set_sha256 }}' \
            --require-evidence
          node tools/verify-package-candidate-binding.ts \
            --desktop-candidate "$candidate_root" \
            --package-candidate "$RUNNER_TEMP/package-candidate" \
            --candidate-id '${{ inputs.package_candidate_id }}'
          node tools/verify-runtime-candidate-binding.ts \
            --desktop-candidate "$candidate_root" \
            --runtime-candidate "$RUNNER_TEMP/runtime-candidate" \
            --candidate-id '${{ inputs.runtime_candidate_id }}'
          java_hash="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); process.stdout.write(m.contractSetSha256||'')" "$RUNNER_TEMP/package-candidate/java-candidate-manifest.json")"
          test "$java_hash" = '${{ inputs.contract_set_sha256 }}'
          test "$(printf '%s' "$java_hash" | wc -c)" = 64

      - name: Verify immutable promotion evidence without building
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/verify-promotion-evidence.ts \
            --candidate-artifacts "$RUNNER_TEMP/candidate-artifacts" \
            --candidate-id '${{ inputs.candidate_id }}' \
            --candidate-manifest-sha256 "$(find "$RUNNER_TEMP/candidate-artifacts" -name candidate-manifest.json -type f -print -quit | xargs sha256sum | cut -d ' ' -f1)" \
            --producer-repository '${{ github.repository }}' \
            --producer-run-id '${{ inputs.candidate_run_id }}' \
            --consumer-gate-run-id '${{ inputs.consumer_gate_run_id }}' \
            --consumer-gate-ledger "$RUNNER_TEMP/consumer-gate/consumer-gate-ledger.json" \
            --consumer-gate-config .github/consumer-gates.json \
            --output "$RUNNER_TEMP/promotion-evidence.json"
          source_commit="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); process.stdout.write(m.sourceCommit)" "$RUNNER_TEMP/promotion-evidence.json")"
          release_version="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); process.stdout.write(m.releaseVersion)" "$RUNNER_TEMP/promotion-evidence.json")"
          candidate_root="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); process.stdout.write(m.candidateRoot)" "$RUNNER_TEMP/promotion-evidence.json")"
          mkdir -p "$RUNNER_TEMP/promotion-input/candidate"
          cp -a "$candidate_root/." "$RUNNER_TEMP/promotion-input/candidate/"
          cp "$RUNNER_TEMP/runtime-candidate/candidate-manifest.json" "$RUNNER_TEMP/promotion-input/candidate/runtime-candidate-manifest.json"
          cp "$RUNNER_TEMP/promotion-evidence.json" "$RUNNER_TEMP/promotion-input/promotion-evidence.json"
          cp "$RUNNER_TEMP/consumer-gate/consumer-gate-ledger.json" "$RUNNER_TEMP/promotion-input/consumer-gate-ledger.json"
          java_candidate_manifest_sha256="$(sha256sum "$RUNNER_TEMP/package-candidate/java-candidate-manifest.json" | cut -d ' ' -f1)"
          java_candidate_id="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); process.stdout.write(m.candidateId)" "$RUNNER_TEMP/package-candidate/java-candidate-manifest.json")"
          runtime_candidate_manifest_sha256="$(sha256sum "$RUNNER_TEMP/runtime-candidate/candidate-manifest.json" | cut -d ' ' -f1)"
          {
            echo "source_commit=$source_commit"
            echo "release_version=$release_version"
            echo "java_candidate_manifest_sha256=$java_candidate_manifest_sha256"
            echo "java_candidate_id=$java_candidate_id"
            echo "runtime_candidate_manifest_sha256=$runtime_candidate_manifest_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the prepared exact promotion input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-input-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/promotion-input
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-npm:
    if: ${{ inputs.publication_scope == 'all' || inputs.publication_scope == 'npm' }}
    needs: prepare-candidate
    uses: ./.github/workflows/_publish-npm.yml
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      candidate_kind: package
      candidate_id: ${{ inputs.package_candidate_id }}
      candidate_run_id: ${{ inputs.package_candidate_run_id }}
      candidate_manifest_sha256: ${{ inputs.package_candidate_manifest_sha256 }}
      source_commit: ${{ needs.prepare-candidate.outputs.source_commit }}
      release_version: ${{ needs.prepare-candidate.outputs.release_version }}
      release_candidate_id: ${{ inputs.candidate_id }}
      contract_set_sha256: ${{ inputs.contract_set_sha256 }}
    secrets: inherit

  publish-pypi:
    if: ${{ inputs.publication_scope == 'all' || inputs.publication_scope == 'pypi' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    environment: capture-registry-pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out promotion tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'

      - name: Download the prepared immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: promotion-input-${{ inputs.candidate_id }}
          path: promotion-input

      - name: Select exact Python project artifacts
        shell: bash
        env:
          PYTHON_PROJECT: ${{ inputs.pypi_project }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/promotion-input/candidate/python"
          target_dir="$RUNNER_TEMP/pypi-python"
          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          shopt -s nullglob
          case "$PYTHON_PROJECT" in
            client)
              artifacts=("$source_dir"/capture_runtime_client-*)
              expected_count=2
              ;;
            *)
              echo "Unsupported Python project lane: $PYTHON_PROJECT" >&2
              exit 1
              ;;
          esac
          test "${#artifacts[@]}" -eq "$expected_count"
          cp -- "${artifacts[@]}" "$target_dir/"

      - name: Publish exact Python distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/pypi-python
          skip-existing: true

      - name: Record the exact PyPI publication ledger
        shell: bash
        env:
          PYTHON_PROJECT: ${{ inputs.pypi_project }}
        run: |
          set -euo pipefail
          case "$PYTHON_PROJECT" in
            client) projects='capture-runtime-client' ;;
            *) echo "Unsupported Python project lane: $PYTHON_PROJECT" >&2; exit 1 ;;
          esac
          node tools/record-pypi-candidate.ts \
            --candidate promotion-input/candidate \
            --python-directory "$RUNNER_TEMP/pypi-python" \
            --projects "$projects" \
            --candidate-id '${{ inputs.runtime_candidate_id }}' \
            --version '${{ needs.prepare-candidate.outputs.release_version }}' \
            --output registry-ledger-pypi.json

      - name: Bind PyPI ledger to the release and runtime candidate
        shell: bash
        env:
          RELEASE_CANDIDATE_ID: ${{ inputs.candidate_id }}
          CONTRACT_SET_SHA256: ${{ inputs.contract_set_sha256 }}
        run: |
          set -euo pipefail
          node --input-type=module -e "const fs=await import('node:fs/promises'); const crypto=await import('node:crypto'); const ledger=JSON.parse(await fs.readFile('registry-ledger-pypi.json','utf8')); if(!/^[0-9a-f]{64}$/.test(process.env.RELEASE_CANDIDATE_ID)||!/^[0-9a-f]{64}$/.test(process.env.CONTRACT_SET_SHA256)) throw new Error('Release candidate ledger binding is incomplete.'); const source=await fs.readFile('promotion-input/candidate/runtime-candidate-manifest.json'); ledger.releaseCandidateId=process.env.RELEASE_CANDIDATE_ID; ledger.contractSetSha256=process.env.CONTRACT_SET_SHA256; ledger.sourceCandidateManifestSha256=crypto.createHash('sha256').update(source).digest('hex'); await fs.writeFile('registry-ledger-pypi.json',JSON.stringify(ledger,null,2)+'\\n');"

      - name: Verify clean Python installation from PyPI
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/capture-pypi-probe"
          uv venv "$probe"
          uv pip install --python "$probe/bin/python" --index-url https://pypi.org/simple \
            $(case '${{ inputs.pypi_project }}' in
              client) echo "capture-runtime-client==${{ needs.prepare-candidate.outputs.release_version }}" ;;
              *) exit 1 ;;
            esac)
          case '${{ inputs.pypi_project }}' in
            client) "$probe/bin/python" -c 'import capture_runtime_client; assert capture_runtime_client.__package__ == "capture_runtime_client"' ;;
            *) exit 1 ;;
          esac

      - name: Upload PyPI publication ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-ledger-pypi-${{ inputs.candidate_id }}
          path: registry-ledger-pypi.json
          if-no-files-found: error
          retention-days: 14

  publish-crates:
    if: ${{ inputs.publication_scope == 'all' || inputs.publication_scope == 'crates' }}
    needs: prepare-candidate
    uses: ./.github/workflows/_publish-crates.yml
    permissions:
      actions: read
      contents: read
    with:
      candidate_id: ${{ inputs.candidate_id }}
      source_candidate_id: ${{ inputs.runtime_candidate_id }}
      source_commit: ${{ needs.prepare-candidate.outputs.source_commit }}
      release_candidate_id: ${{ inputs.candidate_id }}
      contract_set_sha256: ${{ inputs.contract_set_sha256 }}
    secrets: inherit

  publish-maven:
    if: ${{ inputs.publication_scope == 'all' || inputs.publication_scope == 'maven' }}
    needs: prepare-candidate
    uses: ./.github/workflows/_publish-maven.yml
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      candidate_id: ${{ inputs.package_candidate_id }}
      candidate_run_id: ${{ inputs.package_candidate_run_id }}
      candidate_manifest_sha256: ${{ inputs.package_candidate_manifest_sha256 }}
      source_commit: ${{ needs.prepare-candidate.outputs.source_commit }}
      release_version: ${{ needs.prepare-candidate.outputs.release_version }}
      release_candidate_id: ${{ inputs.candidate_id }}
      contract_set_sha256: ${{ inputs.contract_set_sha256 }}
    secrets: inherit

  verify-registries:
    if: >-
      ${{
        always() &&
        needs.prepare-candidate.result == 'success' &&
        ((inputs.publication_scope == 'all' && needs.publish-npm.result == 'success' && needs.publish-pypi.result == 'success' && needs.publish-crates.result == 'success' && needs.publish-maven.result == 'success') ||
         (inputs.publication_scope == 'npm' && needs.publish-npm.result == 'success') ||
         (inputs.publication_scope == 'pypi' && needs.publish-pypi.result == 'success') ||
         (inputs.publication_scope == 'crates' && needs.publish-crates.result == 'success') ||
         (inputs.publication_scope == 'maven' && needs.publish-maven.result == 'success'))
      }}
    needs:
      [
        prepare-candidate,
        publish-npm,
        publish-pypi,
        publish-crates,
        publish-maven,
      ]
    uses: ./.github/workflows/_verify-registries.yml
    permissions:
      actions: read
      contents: read
    with:
      candidate_id: ${{ inputs.candidate_id }}
      source_commit: ${{ needs.prepare-candidate.outputs.source_commit }}
      release_version: ${{ needs.prepare-candidate.outputs.release_version }}
      publication_scope: ${{ inputs.publication_scope }}
      release_candidate_id: ${{ inputs.candidate_id }}
      package_candidate_id: ${{ inputs.package_candidate_id }}
      runtime_candidate_id: ${{ inputs.runtime_candidate_id }}
      java_candidate_id: ${{ needs.prepare-candidate.outputs.java_candidate_id }}
      package_candidate_manifest_sha256: ${{ inputs.package_candidate_manifest_sha256 }}
      java_candidate_manifest_sha256: ${{ needs.prepare-candidate.outputs.java_candidate_manifest_sha256 }}
      runtime_candidate_manifest_sha256: ${{ needs.prepare-candidate.outputs.runtime_candidate_manifest_sha256 }}
      contract_set_sha256: ${{ inputs.contract_set_sha256 }}

  tag-release:
    if: ${{ inputs.publication_scope == 'all' && needs.verify-registries.result == 'success' }}
    needs: [prepare-candidate, verify-registries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-candidate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create or verify the annotated release tag after registries pass
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.prepare-candidate.outputs.release_version }}"
          source_commit='${{ needs.prepare-candidate.outputs.source_commit }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag^{}")" = "$source_commit"
          else
            git tag -a "$tag" "$source_commit" -m "Capture Workbench $tag"
          fi
          git push origin "refs/tags/$tag"

  publish-github-release:
    if: ${{ inputs.publication_scope == 'all' && needs.tag-release.result == 'success' }}
    needs: [prepare-candidate, tag-release]
    uses: ./.github/workflows/_publish-github-release.yml
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    with:
      candidate_id: ${{ inputs.candidate_id }}
      source_commit: ${{ needs.prepare-candidate.outputs.source_commit }}
      tooling_commit: ${{ github.sha }}
      release_version: ${{ needs.prepare-candidate.outputs.release_version }}
      tag: v${{ needs.prepare-candidate.outputs.release_version }}
      java_candidate_id: ${{ needs.prepare-candidate.outputs.java_candidate_id }}

  promotion-ledger:
    if: ${{ inputs.publication_scope == 'all' && needs.publish-stable-pointer.result == 'success' }}
    needs: [prepare-candidate, publish-stable-pointer]
    uses: ./.github/workflows/_publish-promotion-ledger.yml
    permissions:
      actions: read
      contents: read
    with:
      candidate_id: ${{ inputs.candidate_id }}
      source_commit: ${{ needs.prepare-candidate.outputs.source_commit }}

  publish-stable-pointer:
    if: ${{ inputs.publication_scope == 'all' && needs.publish-github-release.result == 'success' }}
    needs: [prepare-candidate, publish-github-release]
    uses: ./.github/workflows/_publish-stable-pointer.yml
    permissions:
      actions: read
      contents: write
    with:
      candidate_id: ${{ inputs.candidate_id }}
      source_commit: ${{ needs.prepare-candidate.outputs.source_commit }}
      tag: v${{ needs.prepare-candidate.outputs.release_version }}
