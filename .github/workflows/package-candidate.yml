name: Release Package Candidate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Intended npm package SemVer, without the v prefix'
        required: true
        type: string
      commit_sha:
        description: 'Exact source commit to package'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source reachability without desktop gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ inputs.commit_sha }}'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor '${{ inputs.commit_sha }}' refs/remotes/origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized package version
        shell: bash
        run: pnpm verify:release-version -- "v${{ inputs.version }}"

      - name: Build and pack the npm package set
        shell: bash
        run: |
          set -euo pipefail
          pnpm nx run capture-angular:pack --skip-nx-cache
          pnpm nx run capture-structuring:pack --skip-nx-cache

      - name: Install Playwright Chromium for consumer evidence
        shell: bash
        run: pnpm exec playwright install chromium

      - name: Assemble the immutable Package Candidate
        shell: bash
        env:
          PACKAGE_CANDIDATE: ${{ runner.temp }}/capture-package-candidate-${{ github.run_id }}
        run: |
          set -euo pipefail
          node tools/assemble-package-candidate.ts \
            --output "$PACKAGE_CANDIDATE" \
            --version '${{ inputs.version }}' \
            --source-commit '${{ inputs.commit_sha }}' \
            --producer-run-id '${{ github.run_id }}'
          manifest="$(node --input-type=module -e "const m=JSON.parse(await import('node:fs/promises').then(x=>x.readFile(process.argv[1],'utf8'))); process.stdout.write(m.candidateId)" "$PACKAGE_CANDIDATE/candidate-manifest.json")"
          manifest_sha256="$(sha256sum "$PACKAGE_CANDIDATE/candidate-manifest.json" | cut -d ' ' -f1)"
          echo "PACKAGE_CANDIDATE=$PACKAGE_CANDIDATE" >> "$GITHUB_ENV"
          echo "PACKAGE_CANDIDATE_ID=$manifest" >> "$GITHUB_ENV"
          echo "PACKAGE_CANDIDATE_MANIFEST_SHA256=$manifest_sha256" >> "$GITHUB_ENV"

      - name: Verify package exports and dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-package-candidate.ts \
            --candidate "$PACKAGE_CANDIDATE" \
            --version '${{ inputs.version }}' \
            --source-commit '${{ inputs.commit_sha }}' \
            --producer-run-id '${{ github.run_id }}' \
            --candidate-id "$PACKAGE_CANDIDATE_ID" \
            --candidate-manifest-sha256 "$PACKAGE_CANDIDATE_MANIFEST_SHA256"
          node tools/verify-candidate-packages.ts \
            --candidate "$PACKAGE_CANDIDATE" \
            --version '${{ inputs.version }}'

      - name: Run Tier 1 Web Component consumer evidence
        shell: bash
        run: pnpm nx run capture-angular:clean-consumer-smoke --skip-nx-cache

      - name: Record package consumer evidence
        if: ${{ always() }}
        shell: bash
        env:
          VERIFICATION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          node tools/record-candidate-verification.ts \
            --candidate "$PACKAGE_CANDIDATE" \
            --verification cross-framework-consumers \
            --status "$VERIFICATION_STATUS" \
            --output "$PACKAGE_CANDIDATE/cross-framework-consumers.json"

      - name: Re-verify the complete Package Candidate evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-package-candidate.ts \
            --candidate "$PACKAGE_CANDIDATE" \
            --version '${{ inputs.version }}' \
            --source-commit '${{ inputs.commit_sha }}' \
            --producer-run-id '${{ github.run_id }}' \
            --candidate-id "$PACKAGE_CANDIDATE_ID" \
            --candidate-manifest-sha256 "$PACKAGE_CANDIDATE_MANIFEST_SHA256" \
            --require-evidence

      - name: Upload immutable Package Candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: capture-package-candidate-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-package-candidate-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
