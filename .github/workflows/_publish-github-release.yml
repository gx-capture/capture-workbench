name: Reusable Capture GitHub Release Publication

on:
  workflow_call:
    inputs:
      candidate_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: capture-github-release
    steps:
      - name: Check out release tooling at the candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the prepared immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: promotion-input-${{ inputs.candidate_id }}
          path: promotion-input

      - name: Fetch and verify the tag created after registry publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"
          test "$(git rev-list -n 1 '${{ inputs.tag }}^{}')" = '${{ inputs.source_commit }}'

      - name: Create or verify the public GitHub Release from exact candidate assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/create-github-release.ts \
            --candidate promotion-input/candidate \
            --tag '${{ inputs.tag }}' \
            --source-commit '${{ inputs.source_commit }}' \
            --output github-release-ledger.json

      - name: Verify an anonymous immutable candidate-manifest download
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/candidate-manifest.json" \
            --output "$RUNNER_TEMP/anonymous-candidate-manifest.json"
          cmp --silent \
            promotion-input/candidate/candidate-manifest.json \
            "$RUNNER_TEMP/anonymous-candidate-manifest.json"

      - name: Upload GitHub Release ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-release-ledger-${{ inputs.candidate_id }}
          path: github-release-ledger.json
          if-no-files-found: error
          retention-days: 14
