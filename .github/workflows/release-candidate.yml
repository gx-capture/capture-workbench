name: Release Candidate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Intended release SemVer, without the v prefix'
        required: true
        type: string
      commit_sha:
        description: 'Exact source commit to build'
        required: true
        type: string
      package_candidate_run_id:
        description: 'Successful Release Package Candidate workflow run for the same source commit'
        required: true
        type: string
      package_candidate_id:
        description: 'Immutable Package Candidate ID'
        required: true
        type: string
      package_candidate_manifest_sha256:
        description: 'SHA-256 of the Package Candidate candidate-manifest.json'
        required: true
        type: string
      runtime_candidate_run_id:
        description: 'Successful Release Runtime Candidate workflow run for the same source commit'
        required: true
        type: string
      runtime_candidate_id:
        description: 'Immutable Runtime Candidate ID'
        required: true
        type: string
      runtime_candidate_manifest_sha256:
        description: 'SHA-256 of the Runtime Candidate candidate-manifest.json'
        required: true
        type: string
      release_mode:
        description: 'Candidate model mode derived from the checked-in source lock'
        required: true
        type: choice
        options:
          - core-only
          - model-enabled

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit reachability and exact CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ inputs.commit_sha }}') { throw 'Checked out commit differs from commit_sha.' }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor $head refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Candidate commit must be reachable from main.' }
          node tools/verify-main-ci.ts `
            --repository "$env:GITHUB_REPOSITORY" `
            --commit "$head" `
            --workflow-path ".github/workflows/ci.yml" `
            --branch "main"

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gx-capture'

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install workspace dependencies
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Download and verify the exact Package Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-package-candidate-${{ inputs.version }}-${{ inputs.package_candidate_run_id }}
          run-id: ${{ inputs.package_candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package-candidate

      - name: Verify Package Candidate identity before desktop assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'package-candidate'
          node tools/verify-package-candidate.ts `
            --candidate "$candidate" `
            --version '${{ inputs.version }}' `
            --source-commit '${{ inputs.commit_sha }}' `
            --producer-run-id '${{ inputs.package_candidate_run_id }}' `
            --candidate-id '${{ inputs.package_candidate_id }}' `
            --candidate-manifest-sha256 '${{ inputs.package_candidate_manifest_sha256 }}' `
            --require-evidence
          "PACKAGE_CANDIDATE_PATH=$candidate" >> $env:GITHUB_ENV

      - name: Download and verify the exact Runtime Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-runtime-candidate-${{ inputs.version }}-${{ inputs.runtime_candidate_run_id }}
          run-id: ${{ inputs.runtime_candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime-candidate

      - name: Verify Runtime Candidate identity before desktop assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'runtime-candidate'
          node tools/verify-runtime-candidate.ts `
            --candidate "$candidate" `
            --version '${{ inputs.version }}' `
            --source-commit '${{ inputs.commit_sha }}' `
            --producer-run-id '${{ inputs.runtime_candidate_run_id }}' `
            --candidate-id '${{ inputs.runtime_candidate_id }}' `
            --candidate-manifest-sha256 '${{ inputs.runtime_candidate_manifest_sha256 }}' `
            --package-candidate-id '${{ inputs.package_candidate_id }}' `
            --require-evidence
          "RUNTIME_CANDIDATE_PATH=$candidate" >> $env:GITHUB_ENV

      - name: Verify centralized release metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm verify:release-version -- "v$env:RELEASE_VERSION"

      - name: Verify requested model mode
        shell: pwsh
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-runtime:classify-release-model-mode
          $actual = (Get-Content packages/capture-runtime/dist/metadata/release-model-mode.json -Raw | ConvertFrom-Json).releaseMode
          if ($actual -ne $env:RELEASE_MODE) { throw "Requested release mode $env:RELEASE_MODE differs from source-lock mode $actual." }

      - name: Build Windows installer from the exact Runtime Candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/capture-workbench-desktop/scripts/stage-runtime.ts `
            --artifact "$env:RUNTIME_CANDIDATE_PATH/runtime/capture-runtime-x86_64-pc-windows-msvc.exe" `
            --manifest "$env:RUNTIME_CANDIDATE_PATH/runtime/capture-runtime-manifest.json" `
            --schema "$env:RUNTIME_CANDIDATE_PATH/runtime/capture-document-v1.schema.json" `
            --source release
          pnpm nx run capture-workbench-desktop:build-nsis

      - name: Measure exact installed size
        shell: pwsh
        run: node apps/capture-workbench-desktop/scripts/installed-deterministic-smoke.ts --measure-release-size

      - name: Verify packaging budget
        shell: pwsh
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path packages/capture-runtime/dist/release | Out-Null
          Copy-Item -Path "$env:RUNTIME_CANDIDATE_PATH/runtime/*" -Destination packages/capture-runtime/dist/release -Recurse -Force
          $sizeTarget = if ($env:RELEASE_MODE -eq 'model-enabled') { 'capture-runtime:size-regression-check-model-enabled' } else { 'capture-runtime:size-regression-check' }
          pnpm nx run $sizeTarget
          Copy-Item packages/capture-runtime/dist/size/runtime-size-report.json packages/capture-runtime/dist/release/runtime-size-report.json
          $digest = (Get-FileHash packages/capture-runtime/dist/release/runtime-size-report.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  runtime-size-report.json" | Set-Content packages/capture-runtime/dist/release/runtime-size-report.json.sha256 -Encoding utf8NoBOM

      - name: Assemble and verify immutable candidate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $candidate = Join-Path $env:RUNNER_TEMP "capture-candidate-$env:GITHUB_RUN_ID"
          node tools/assemble-release-candidate.ts `
            --output "$candidate" `
            --version "$env:RELEASE_VERSION" `
            --release-mode "$env:RELEASE_MODE" `
            --package-candidate "$env:PACKAGE_CANDIDATE_PATH" `
            --runtime-candidate "$env:RUNTIME_CANDIDATE_PATH"
          $sourceCommit = (git rev-parse HEAD).Trim()
          node tools/verify-release-candidate.ts `
            --candidate "$candidate" `
            --version "$env:RELEASE_VERSION" `
            --source-commit "$sourceCommit" `
            --release-mode "$env:RELEASE_MODE" `
            --package-candidate-id '${{ inputs.package_candidate_id }}' `
            --runtime-candidate-id '${{ inputs.runtime_candidate_id }}'
          "CAPTURE_CANDIDATE_PATH=$candidate" >> $env:GITHUB_ENV
          $manifest = Get-Content "$candidate/candidate-manifest.json" -Raw | ConvertFrom-Json
          "candidateId=$($manifest.candidateId)" >> $env:GITHUB_OUTPUT

      - name: Generate candidate-bound contract impact classification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $candidate = $env:CAPTURE_CANDIDATE_PATH
          $manifest = Get-Content "$candidate/candidate-manifest.json" -Raw | ConvertFrom-Json
          $baseline = Join-Path $env:RUNNER_TEMP 'stable-contract-snapshot.json'
          $baselineArgs = @()
          try {
            git fetch --no-tags origin refs/heads/release-index:refs/remotes/origin/release-index
            $stable = git show refs/remotes/origin/release-index:release-index/stable.json | ConvertFrom-Json
            if ($stable.releaseTag) {
              $downloadDirectory = Join-Path $env:RUNNER_TEMP 'stable-release'
              New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
              gh release download $stable.releaseTag --repo $env:GITHUB_REPOSITORY --pattern capture-contract-snapshot.json --dir $downloadDirectory
              Copy-Item (Join-Path $downloadDirectory 'capture-contract-snapshot.json') $baseline
              $baselineArgs = @('--baseline', $baseline)
            }
          } catch {
            Write-Host "No usable stable contract baseline was available; classification will require manual review."
          }
          node tools/classify-release-contract.ts `
            --candidate $candidate `
            --candidate-id $manifest.candidateId `
            @baselineArgs `
            --output (Join-Path $env:RUNNER_TEMP 'contract-impact.json')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'contract-impact.json') (Join-Path $candidate 'contract-impact.json')

      - name: Upload immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-candidate-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-candidate-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify-windows-install:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Ensure WebView2 Evergreen Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clientGuid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $registryKeys = @(
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$clientGuid",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$clientGuid",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$clientGuid"
          )
          function Test-WebView2RuntimeInstalled {
            foreach ($registryKey in $registryKeys) {
              $version = (Get-ItemProperty -LiteralPath $registryKey -Name 'pv' -ErrorAction SilentlyContinue).pv
              if ($version) {
                try {
                  if ([version]$version -gt [version]'0.0.0.0') { return $true }
                } catch {
                  continue
                }
              }
            }
            return $false
          }

          if (-not (Test-WebView2RuntimeInstalled)) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest `
              -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
              -OutFile $bootstrapper
            $installerProcess = Start-Process `
              -FilePath $bootstrapper `
              -ArgumentList '/silent', '/install' `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            if ($installerProcess.ExitCode -ne 0) {
              throw "WebView2 Evergreen Runtime installer failed with exit code $($installerProcess.ExitCode)."
            }
          }

          $runtimeReady = $false
          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            if (Test-WebView2RuntimeInstalled) {
              $runtimeReady = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $runtimeReady) {
            throw 'WebView2 Evergreen Runtime is not installed after prerequisite setup.'
          }

      - name: Download and verify the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-candidate

      - name: Stage and install the exact candidate installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $candidate = Join-Path $env:RUNNER_TEMP 'capture-candidate'
          $sourceCommit = (git rev-parse HEAD).Trim()
          node tools/verify-release-candidate.ts `
            --candidate "$candidate" `
            --version "$env:RELEASE_VERSION" `
            --source-commit "$sourceCommit" `
            --release-mode "$env:RELEASE_MODE" `
            --runtime-candidate-id '${{ inputs.runtime_candidate_id }}'
          node apps/capture-workbench-desktop/scripts/stage-runtime.ts `
            --artifact "$candidate/runtime/capture-runtime-x86_64-pc-windows-msvc.exe" `
            --manifest "$candidate/runtime/capture-runtime-manifest.json" `
            --schema "$candidate/runtime/capture-document-v1.schema.json" `
            --source release
          $nsis = 'apps/capture-workbench-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          New-Item -ItemType Directory -Force -Path $nsis | Out-Null
          $installer = Get-ChildItem "$candidate/desktop" -Filter '*.exe' -File
          if ($installer.Count -ne 1) { throw "Expected exactly one candidate installer, found $($installer.Count)." }
          $tauriInstallerName = "Capture Workbench_$env:RELEASE_VERSION`_x64-setup.exe"
          Copy-Item -LiteralPath $installer[0].FullName -Destination (Join-Path $nsis $tauriInstallerName)
          node apps/capture-workbench-desktop/scripts/installed-deterministic-smoke.ts --release

      - name: Record candidate verification result
        if: ${{ always() }}
        shell: pwsh
        env:
          VERIFICATION_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/record-candidate-verification.ts `
            --candidate (Join-Path $env:RUNNER_TEMP 'capture-candidate') `
            --verification windows-install `
            --status "$env:VERIFICATION_STATUS" `
            --output (Join-Path $env:RUNNER_TEMP 'windows-install.json')

      - name: Upload candidate verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-candidate-verification-windows-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-install.json
          if-no-files-found: warn
          retention-days: 14

  verify-runtime-product:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-candidate
      - name: Verify runtime readiness and cancellation boundaries
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $candidate = Join-Path $env:RUNNER_TEMP 'capture-candidate'
          $sourceCommit = (git rev-parse HEAD).Trim()
          node tools/verify-release-candidate.ts --candidate "$candidate" --version "$env:RELEASE_VERSION" --source-commit "$sourceCommit" --release-mode "$env:RELEASE_MODE" --runtime-candidate-id '${{ inputs.runtime_candidate_id }}'
          node tools/local-release-consumer-smoke.ts --runtime-dir "$candidate/runtime" --version "$env:RELEASE_VERSION"

      - name: Record candidate verification result
        if: ${{ always() }}
        shell: pwsh
        env:
          VERIFICATION_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/record-candidate-verification.ts `
            --candidate (Join-Path $env:RUNNER_TEMP 'capture-candidate') `
            --verification runtime-product `
            --status "$env:VERIFICATION_STATUS" `
            --output (Join-Path $env:RUNNER_TEMP 'runtime-product.json')

      - name: Upload candidate verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-candidate-verification-runtime-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-product.json
          if-no-files-found: warn
          retention-days: 14

  verify-cross-framework-consumers:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.15.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-candidate
      - name: Verify candidate package exports and dependency boundaries
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $candidate = Join-Path $env:RUNNER_TEMP 'capture-candidate'
          $sourceCommit = (git rev-parse HEAD).Trim()
          node tools/verify-release-candidate.ts --candidate "$candidate" --version "$env:RELEASE_VERSION" --source-commit "$sourceCommit" --release-mode "$env:RELEASE_MODE" --runtime-candidate-id '${{ inputs.runtime_candidate_id }}'
          New-Item -ItemType Directory -Force -Path 'dist/packs' | Out-Null
          Copy-Item -Path (Join-Path $candidate 'package/*.tgz') -Destination 'dist/packs' -Force
          node tools/verify-candidate-packages.ts --candidate "$candidate" --version "$env:RELEASE_VERSION"
          pnpm exec playwright install chromium
          node tools/clean-angular-consumer-smoke.ts

      - name: Record candidate verification result
        if: ${{ always() }}
        shell: pwsh
        env:
          VERIFICATION_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/record-candidate-verification.ts `
            --candidate (Join-Path $env:RUNNER_TEMP 'capture-candidate') `
            --verification cross-framework-consumers `
            --status "$env:VERIFICATION_STATUS" `
            --output (Join-Path $env:RUNNER_TEMP 'cross-framework-consumers.json')

      - name: Upload candidate verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-candidate-verification-cross-framework-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cross-framework-consumers.json
          if-no-files-found: warn
          retention-days: 14

  verify-model-enabled-runtime:
    needs: build-candidate
    if: ${{ inputs.release_mode == 'model-enabled' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capture-candidate-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-candidate
      - name: Verify model catalog provenance without ambient stores
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $candidate = Join-Path $env:RUNNER_TEMP 'capture-candidate'
          $sourceCommit = (git rev-parse HEAD).Trim()
          node tools/verify-release-candidate.ts --candidate "$candidate" --version "$env:RELEASE_VERSION" --source-commit "$sourceCommit" --release-mode "$env:RELEASE_MODE" --runtime-candidate-id '${{ inputs.runtime_candidate_id }}'
          $catalog = Get-Content "$candidate/runtime/capture-engine-catalog.json" -Raw | ConvertFrom-Json
          if ($catalog.runtimeVersion -ne $env:RELEASE_VERSION) { throw 'Candidate model catalog runtime version drifted.' }
          if ($catalog.requirements.Count -ne 2) { throw 'Model-enabled candidate must contain exactly OCR and Whisper requirements.' }
          if ((@($catalog.requirements | ForEach-Object requirementId) -join ',') -ne 'windowsml-ocr,whisper-primary') { throw 'Model-enabled candidate requirements are not source-lock ordered.' }
          uv run --no-project --python 3.12 python packages/capture-runtime/scripts/model_source_lock.py validate
          node tools/local-release-consumer-smoke.ts --runtime-dir "$candidate/runtime" --version "$env:RELEASE_VERSION"
          $ambient = Get-ChildItem Env: | Where-Object { $_.Name -match '^(?:CAPTURE_(?:USER_MODEL_DIR|EXTRACTION_PROVIDER|STRUCTURING_PROVIDER|OLLAMA_[A-Z0-9_]+|WINDOWSML_[A-Z0-9_]+|WHISPER_[A-Z0-9_]+)|OLLAMA_(?:MODELS|HOST))$' }
          if ($ambient) { throw "Ambient model/provider variables must not influence verification: $($ambient.Name -join ', ')." }

      - name: Record candidate verification result
        if: ${{ always() }}
        shell: pwsh
        env:
          VERIFICATION_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/record-candidate-verification.ts `
            --candidate (Join-Path $env:RUNNER_TEMP 'capture-candidate') `
            --verification model-enabled-runtime `
            --status "$env:VERIFICATION_STATUS" `
            --output (Join-Path $env:RUNNER_TEMP 'model-enabled-runtime.json')

      - name: Upload candidate verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-candidate-verification-model-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/model-enabled-runtime.json
          if-no-files-found: warn
          retention-days: 14
