name: Reusable Capture PyPI Publication

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      candidate_kind:
        description: 'Explicit standalone layout: runtime or package'
        required: true
        type: string
      candidate_id:
        required: true
        type: string
      package_candidate_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      candidate_run_id:
        description: 'Successful Release Package Candidate workflow run when candidate_kind is package'
        required: false
        default: ''
        type: string
      candidate_manifest_sha256:
        description: 'SHA-256 of the selected standalone candidate-manifest.json'
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_candidate_id:
        description: 'Standalone release candidate ID bound to this source ledger'
        required: true
        type: string
      contract_set_sha256:
        description: 'Canonical v2 contract-set hash for this release train'
        required: true
        type: string
      python_project:
        description: 'Python project lane: runtime client'
        required: false
        default: client
        type: string
      ledger_candidate_id:
        description: 'Source registry ledger candidate ID when it differs from the promotion input'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: capture-registry-pypi
    env:
      PYPI_KIND: ${{ inputs.candidate_kind }}
      PYPI_CANDIDATE_ID: ${{ inputs.ledger_candidate_id || inputs.candidate_id }}
      PYPI_RELEASE_ID: ${{ inputs.release_candidate_id }}
      PYPI_PACKAGE_ID: ${{ inputs.package_candidate_id }}
      PYPI_SOURCE: ${{ inputs.source_commit }}
      PYPI_VERSION: ${{ inputs.release_version }}
      PYPI_CONTRACT: ${{ inputs.contract_set_sha256 }}
      PYPI_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
    steps:
      - name: Check out publication tooling at the candidate source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js 24 for publication tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'

      - name: Download the prepared immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.candidate_kind != 'package' }}
        with:
          name: promotion-input-${{ inputs.candidate_id }}
          path: promotion-input

      - name: Download the exact immutable Package Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.candidate_kind == 'package' }}
        with:
          name: capture-package-candidate-${{ inputs.release_version }}-${{ inputs.candidate_run_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: promotion-input/candidate

      - name: Verify the exact package producer run and Python candidate
        if: ${{ inputs.candidate_kind == 'package' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n '${{ inputs.candidate_run_id }}'
          test -n '${{ inputs.candidate_manifest_sha256 }}'
          run_json="$(gh run view '${{ inputs.candidate_run_id }}' --repo '${{ github.repository }}' --json status,conclusion,workflowName,headSha)"
          node --input-type=module -e "const r=JSON.parse(process.argv[1]); if(r.status!=='completed'||r.conclusion!=='success'||r.workflowName!=='Release Package Candidate'||r.headSha!=='${{ inputs.source_commit }}') throw new Error('Package producer run is not a successful exact-source package candidate.');" "$run_json"
          node tools/verify-package-candidate.ts \
            --candidate promotion-input/candidate \
            --version '${{ inputs.release_version }}' \
            --source-commit '${{ inputs.source_commit }}' \
            --producer-run-id '${{ inputs.candidate_run_id }}' \
            --candidate-id '${{ inputs.candidate_id }}' \
            --candidate-manifest-sha256 '${{ inputs.candidate_manifest_sha256 }}' \
            --contract-set-sha256 '${{ inputs.contract_set_sha256 }}' \
            --require-evidence

      - name: Select exact Python project artifacts
        shell: bash
        env:
          PYTHON_PROJECT: ${{ inputs.python_project }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/promotion-input/candidate/python"
          target_dir="$RUNNER_TEMP/pypi-python"
          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          case "$PYTHON_PROJECT" in
            client)
              pattern='capture_runtime_client-*'
              ;;
            *)
              echo "Unsupported Python project lane: $PYTHON_PROJECT" >&2
              exit 1
              ;;
          esac
          shopt -s nullglob
          artifacts=("$source_dir"/$pattern)
          expected_count=2
          test "${#artifacts[@]}" -eq "$expected_count"
          cp -- "${artifacts[@]}" "$target_dir/"

      - name: Preflight exact PyPI identity, staged bytes and remote retries
        shell: bash
        run: |
          set -euo pipefail
          node tools/record-pypi-candidate.ts \
            --mode preflight \
            --candidate promotion-input/candidate \
            --python-directory "$RUNNER_TEMP/pypi-python" \
            --candidate-kind "$PYPI_KIND" \
            --candidate-id "$PYPI_CANDIDATE_ID" \
            --release-candidate-id "$PYPI_RELEASE_ID" \
            --package-candidate-id "$PYPI_PACKAGE_ID" \
            --source-commit "$PYPI_SOURCE" \
            --version "$PYPI_VERSION" \
            --contract-set-sha256 "$PYPI_CONTRACT" \
            --candidate-manifest-sha256 "$PYPI_MANIFEST_SHA256" \
            --source-candidate-manifest-sha256 "$PYPI_MANIFEST_SHA256" \
            --binding "$RUNNER_TEMP/pypi-preflight.json"

      - name: Publish exact Python distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/pypi-python
          skip-existing: true

      - name: Record the exact PyPI client bootstrap ledger after mandatory readback
        shell: bash
        run: |
          set -euo pipefail
          node tools/record-pypi-candidate.ts \
            --mode record \
            --candidate promotion-input/candidate \
            --python-directory "$RUNNER_TEMP/pypi-python" \
            --candidate-kind "$PYPI_KIND" \
            --candidate-id "$PYPI_CANDIDATE_ID" \
            --release-candidate-id "$PYPI_RELEASE_ID" \
            --package-candidate-id "$PYPI_PACKAGE_ID" \
            --source-commit "$PYPI_SOURCE" \
            --version "$PYPI_VERSION" \
            --contract-set-sha256 "$PYPI_CONTRACT" \
            --candidate-manifest-sha256 "$PYPI_MANIFEST_SHA256" \
            --source-candidate-manifest-sha256 "$PYPI_MANIFEST_SHA256" \
            --binding "$RUNNER_TEMP/pypi-preflight.json" \
            --output registry-ledger-pypi.json

      - name: Verify clean Python installation from PyPI
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/capture-pypi-probe"
          uv venv "$probe"
          uv pip install --python "$probe/bin/python" --index-url https://pypi.org/simple \
            $(case '${{ inputs.python_project }}' in
              client) echo "capture-runtime-client==${{ inputs.release_version }}" ;;
              *) exit 1 ;;
            esac)
          case '${{ inputs.python_project }}' in
            client) "$probe/bin/python" -c 'import capture_runtime_client; assert capture_runtime_client.__package__ == "capture_runtime_client"' ;;
          esac

      - name: Upload PyPI publication ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-ledger-pypi-${{ inputs.release_candidate_id || inputs.candidate_id }}
          path: registry-ledger-pypi.json
          if-no-files-found: error
          retention-days: 14
