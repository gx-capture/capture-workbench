name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CI runs only when code or build, test, or release configuration changes.
# Markdown and agent notes never trigger it. Tests read the workflow files,
# .github/consumer-gates.json, release/, release-index/, and test-fixtures/,
# so those count as code. A pattern starting with ! must stay after the
# patterns it narrows.
on:
  pull_request:
    paths: &code-paths
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'test-fixtures/**'
      - 'release/**'
      - 'release-index/**'
      - '.github/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.prettierrc*'
      - '.prettierignore'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.npmrc*'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '!**/*.md'
      - '!**/.agents/**'
  push:
    branches: [main]
    paths: *code-paths

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Branch pushes get one
# group per commit: a ref-wide group would let a newer push replace a pending
# older run, and every main commit a release candidate names needs its own
# successful push run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only main runs the full verification: the four jobs after `checks`, which
# also build the packages, engine workers, installer, and desktop product and
# run the reference flow. They are independent and run in parallel; a release
# candidate requires the whole run to succeed on main
# (tools/verify-main-ci.ts). A docs-only commit on main gets no run, so
# dispatch candidates at the latest commit that changed code. Pull requests
# run only `checks`.
jobs:
  # Pull requests: lint, type checks, and unit tests of the projects a change
  # affects, without builds, packaging, engine workers, the installer, the
  # desktop product, or the reference flow. Contract, architecture, and
  # dead-code gates still cover the whole workspace. A failure only the push
  # jobs catch shows on main's push run.
  checks:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Prepare Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Check contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-runtime:check-contracts
          # Scans every TypeScript file under apps, packages and tools, so it
          # runs on every pull request, not only when capture-angular is affected.
          pnpm nx run capture-angular:async-boundary-check

      - name: Check affected projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx affected -t "classify-release-model-mode,python-version-check,typecheck,test,cargo-fmt-check,typecheck-scripts,package-qa-test,fake-runtime-routes,release-version-typecheck,python-candidate-index-typecheck,release-version-test,release-candidate-test,contract-impact-test,release-contract-test,consumer-gate-test,promotion-evidence-test,promotion-registry-test,release-manifest-test,release-index-test" --base=origin/main --head=HEAD --parallel=1
          pnpm nx affected -t lint --exclude="capture-tools,capture-workbench-desktop,capture-workbench-e2e" --base=origin/main --head=HEAD --parallel=1
          pnpm nx affected -t cargo-test --exclude=capture-workbench-desktop --base=origin/main --head=HEAD --parallel=1

      # knip (TypeScript) and vulture (Python) dead-code ratchet. --ci also
      # fails when a baseline entry is gone, so the baseline only shrinks.
      - name: Dead-code gate
        shell: pwsh
        run: node tools/dead-code-gate.ts --ci

      # docs/architecture/*.md are generated from the Nx graph, the grimp
      # import graph, and the Sheriff modules; fix with architecture:update.
      - name: Architecture diagrams
        shell: pwsh
        run: pnpm run architecture:check

      # Known boundary exceptions (import-linter ignore_imports, ESLint
      # disables and suppressions of Nx and Sheriff rules) may only shrink;
      # --ci also fails on a stale baseline (architecture-exceptions:update).
      - name: Architecture exceptions gate
        shell: pwsh
        run: node tools/architecture-exceptions-gate.ts --ci

  # Published packages: TypeScript and Python clients, the sidecar
  # launcher crate, and the Angular Web Component package.
  packages:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Prepare Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify canonical release metadata
        shell: pwsh
        run: pnpm nx run capture-runtime:classify-release-model-mode

      - name: Install Playwright Chromium
        shell: pwsh
        run: pnpm exec playwright install chromium

      - name: Verify Capture Workbench package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-runtime:check-contracts
          pnpm nx run capture-runtime-client:lint
          pnpm nx run capture-runtime-client:typecheck
          pnpm nx run capture-runtime-client:test
          pnpm nx run capture-runtime-client:build
          pnpm nx run capture-runtime-client-python:lint
          pnpm nx run capture-runtime-client-python:typecheck
          pnpm nx run capture-runtime-client-python:test
          pnpm nx run capture-runtime-client-python:build
          pnpm nx run capture-sidecar-launcher:cargo-fmt-check
          pnpm nx run capture-sidecar-launcher:cargo-check
          pnpm nx run capture-sidecar-launcher:cargo-test
          pnpm nx run capture-sidecar-launcher:cargo-package-dry-run
          pnpm nx run capture-angular:lint
          pnpm nx run capture-angular:test
          pnpm nx run capture-angular:build
          pnpm nx run capture-angular:clean-consumer-smoke

  # Capture Runtime (Python) and the optional OCR, CUDA speech, diarization,
  # and CPU speech worker builds. The CPU speech worker is one more
  # PyInstaller pass on CPU PyTorch: a 302 MiB archive, about 4 minutes on a
  # developer machine.
  runtime:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify capture runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-runtime:python-version-check
          pnpm nx run capture-runtime:lint
          pnpm nx run capture-runtime:typecheck
          pnpm nx run capture-runtime:test
          pnpm nx run capture-runtime:build

      - name: Build and verify optional engine workers
        shell: pwsh
        run: pnpm nx run capture-runtime:verify-worker-boundaries

      - name: Build and start the speaker diarization worker
        shell: pwsh
        run: pnpm nx run capture-runtime:verify-diarization-worker

      - name: Build and verify the CPU speech recognition worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-runtime:verify-speech-recognition-cpu-worker
          pnpm nx run capture-runtime:verify-speech-recognition-cpu-boundary

      - name: Upload workers packaging diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-runtime-packaging-workers-${{ github.sha }}
          path: |
            packages/capture-runtime/dist/engines/*-files.json
            packages/capture-runtime/dist/ocr-worker-inventory.txt
            packages/capture-runtime/dist/speech-recognition-worker-inventory.txt
            packages/capture-runtime/.build/pyinstaller/ocr-worker/capture-engine-ocr/xref-capture-engine-ocr.html
            packages/capture-runtime/.build/pyinstaller/ocr-worker/capture-engine-ocr/warn-capture-engine-ocr.txt
            packages/capture-runtime/.build/pyinstaller/speech-recognition-worker/capture-engine-speech-recognition/xref-capture-engine-speech-recognition.html
            packages/capture-runtime/.build/pyinstaller/speech-recognition-worker/capture-engine-speech-recognition/warn-capture-engine-speech-recognition.txt
            packages/capture-runtime/dist/speech-recognition-cpu-worker-inventory.txt
            packages/capture-runtime/.build/pyinstaller/speech-recognition-cpu-worker/capture-engine-speech-recognition-cpu/xref-capture-engine-speech-recognition-cpu.html
            packages/capture-runtime/.build/pyinstaller/speech-recognition-cpu-worker/capture-engine-speech-recognition-cpu/warn-capture-engine-speech-recognition-cpu.txt
          if-no-files-found: warn
          retention-days: 7

  # Production core runtime, the desktop contract check against it, and the
  # core-only NSIS installer.
  installer:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Prepare Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build and verify the core-only Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-workbench-desktop:stage-core-runtime
          pnpm nx run capture-workbench-desktop:contract-consistency
          pnpm nx run capture-runtime:verify-core-boundary
          pnpm nx run capture-workbench-desktop:build-nsis

      - name: Upload core packaging diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-runtime-packaging-core-${{ github.sha }}
          path: |
            packages/capture-runtime/dist/core-inventory.txt
            packages/capture-runtime/dist/core-inventory-recursive.txt
            packages/capture-runtime/.build/pyinstaller/core-onefile/capture-runtime/xref-capture-runtime.html
            packages/capture-runtime/.build/pyinstaller/core-onefile/capture-runtime/warn-capture-runtime.txt
          if-no-files-found: warn
          retention-days: 7

  # Reference app, desktop product, release tooling, and the browser
  # reference flow.
  desktop:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: pwsh
        run: pnpm exec playwright install chromium

      - name: Verify reference app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-workbench:lint
          pnpm nx run capture-workbench:test
          pnpm nx run capture-workbench:build
          pnpm nx run capture-workbench:production-bundle-check

      - name: Verify release and promotion tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-tools:test
          pnpm nx run capture-tools:release-version-test
          pnpm nx run capture-tools:release-candidate-test
          pnpm nx run capture-tools:contract-impact-test
          pnpm nx run capture-tools:release-contract-test
          pnpm nx run capture-tools:consumer-gate-test
          pnpm nx run capture-tools:promotion-evidence-test
          pnpm nx run capture-tools:promotion-registry-test
          pnpm nx run capture-tools:release-manifest-test
          pnpm nx run capture-tools:release-index-test

      # The Tauri build embeds the reference app built above and the staged
      # runtime resources; cargo-check, cargo-test and smoke-deterministic
      # depend on stage-deterministic-runtime, which stages the fixture runtime
      # under target/deterministic-qa without building the production runtime.
      - name: Verify Capture Workbench desktop product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm nx run capture-workbench-desktop:cargo-fmt-check
          pnpm nx run capture-workbench-desktop:cargo-check
          pnpm nx run capture-workbench-desktop:cargo-test
          pnpm nx run capture-workbench-desktop:package-qa-test
          pnpm nx run capture-workbench-desktop:smoke-deterministic

      - name: Verify reference flow
        shell: pwsh
        run: pnpm nx run capture-workbench-e2e:e2e

      - name: Upload reference flow Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-workbench-reference-playwright-${{ github.run_id }}
          path: dist/.playwright/apps/capture-workbench-e2e/**
          if-no-files-found: error
          retention-days: 7
